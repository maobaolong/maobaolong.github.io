<svg width="1200" height="670" viewBox="0 0 1200 670" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Attention KV 与递归状态对比</title>
  <desc id="desc">左侧展示 Full Attention 为每个 token 保存 K/V，右侧展示 Mamba 和 GDN 逐 token 更新固定大小状态。</desc>
  <defs>
    <marker id="blueArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L9 5.5L1 10" stroke="#7DD3FC" stroke-width="2"/></marker>
    <marker id="greenArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L9 5.5L1 10" stroke="#86EFAC" stroke-width="2"/></marker>
    <style>
      .title{font:700 34px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#F8FAFC}
      .head{font:700 23px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#F8FAFC}
      .body{font:500 16px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#D6E3F0}
      .small{font:500 14px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#9FB2C7}
      .mono{font:700 15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#F8FAFC}
    </style>
  </defs>
  <rect width="1200" height="670" rx="20" fill="#0A1220"/>
  <text x="64" y="62" class="title">同样为了“记住历史”，保存的数据结构完全不同</text>
  <line x1="600" y1="102" x2="600" y2="594" stroke="#334155" stroke-width="2"/>

  <text x="74" y="132" class="head">Full Attention：历史是一排 K/V</text>
  <text x="74" y="163" class="body">每个旧 token 都有可寻址条目</text>
  <g>
    <rect x="76" y="212" width="82" height="64" rx="8" fill="#17354E" stroke="#38BDF8"/><text x="97" y="250" class="mono">x₀</text>
    <rect x="190" y="212" width="82" height="64" rx="8" fill="#17354E" stroke="#38BDF8"/><text x="211" y="250" class="mono">x₁</text>
    <rect x="304" y="212" width="82" height="64" rx="8" fill="#17354E" stroke="#38BDF8"/><text x="325" y="250" class="mono">x₂</text>
    <rect x="418" y="212" width="82" height="64" rx="8" fill="#17354E" stroke="#38BDF8"/><text x="439" y="250" class="mono">x₃</text>
    <path d="M158 244H186M272 244H300M386 244H414" stroke="#7DD3FC" stroke-width="2" marker-end="url(#blueArrow)"/>
  </g>
  <g>
    <rect x="76" y="330" width="92" height="76" rx="8" fill="#132C43"/><text x="99" y="362" class="mono">K₀</text><text x="99" y="389" class="mono">V₀</text>
    <rect x="188" y="330" width="92" height="76" rx="8" fill="#132C43"/><text x="211" y="362" class="mono">K₁</text><text x="211" y="389" class="mono">V₁</text>
    <rect x="300" y="330" width="92" height="76" rx="8" fill="#132C43"/><text x="323" y="362" class="mono">K₂</text><text x="323" y="389" class="mono">V₂</text>
    <rect x="412" y="330" width="92" height="76" rx="8" fill="#132C43"/><text x="435" y="362" class="mono">K₃</text><text x="435" y="389" class="mono">V₃</text>
    <path d="M117 280V326M231 280V326M345 280V326M459 280V326" stroke="#7DD3FC" stroke-width="2" marker-end="url(#blueArrow)"/>
  </g>
  <text x="92" y="466" class="body">Decode query 可以回看每一个保留的 token 条目</text>
  <text x="92" y="498" class="small">Full Attention：条目数随上下文增长</text>
  <text x="92" y="524" class="small">SWA：只保留最近 W 个条目，但仍是逐 token KV</text>

  <text x="636" y="132" class="head">Mamba / GDN：历史进入一个 running state</text>
  <text x="636" y="163" class="body">新 token 到来时，原地更新固定大小状态</text>
  <rect x="642" y="218" width="128" height="72" rx="8" fill="#24324B"/><text x="680" y="261" class="mono">state₀</text>
  <rect x="812" y="218" width="76" height="72" rx="8" fill="#3A2A31"/><text x="837" y="261" class="mono">x₁</text>
  <path d="M770 254H808" stroke="#86EFAC" stroke-width="2" marker-end="url(#greenArrow)"/>
  <path d="M850 294V334H757" stroke="#86EFAC" stroke-width="2" marker-end="url(#greenArrow)"/>
  <rect x="642" y="338" width="216" height="82" rx="8" fill="#173D35" stroke="#22C55E"/><text x="681" y="373" class="body">递归更新 F</text><text x="670" y="400" class="mono">F(state₀, x₁)</text>
  <path d="M862 379H934" stroke="#86EFAC" stroke-width="2" marker-end="url(#greenArrow)"/>
  <rect x="938" y="338" width="168" height="82" rx="8" fill="#173D35"/><text x="978" y="386" class="mono">state₁</text>
  <text x="656" y="474" class="body">继续处理时，只携带 state₁，而不是所有旧 token</text>
  <text x="656" y="506" class="small">Mamba：SSM state 与短卷积状态</text>
  <text x="656" y="532" class="small">GDN：gated delta-rule 的递归矩阵状态</text>

  <rect x="170" y="608" width="860" height="38" rx="8" fill="#1A2638"/>
  <text x="218" y="633" class="body">Prefix resume 的含义：Attention 恢复一段 K/V；Mamba/GDN 恢复某个边界上的 state。</text>
</svg>
