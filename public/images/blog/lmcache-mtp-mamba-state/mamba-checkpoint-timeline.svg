<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MTP 如何改变 Mamba checkpoint 切分</title>
  <desc id="desc">对比 MTP 关闭时三段 Prefill 和 MTP 开启时两段 Prefill，说明 3232 边界为何不再 materialize state。</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L9 5.5L1 10" stroke="#FDE68A" stroke-width="2"/></marker>
    <style>
      .title{font:700 34px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#F8FAFC}
      .head{font:700 21px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#F8FAFC}
      .body{font:500 16px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#D8E5F3}
      .mono{font:700 15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#F8FAFC}
      .small{font:500 14px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#AAB9C9}
    </style>
  </defs>
  <rect width="1200" height="700" rx="20" fill="#09111E"/>
  <text x="62" y="62" class="title">同一段 Prompt，MTP 改变了值得保存的边界</text>

  <line x1="208" y1="138" x2="1080" y2="138" stroke="#64748B" stroke-width="3"/>
  <line x1="208" y1="128" x2="208" y2="148" stroke="#94A3B8" stroke-width="3"/>
  <line x1="500" y1="128" x2="500" y2="148" stroke="#94A3B8" stroke-width="3"/>
  <line x1="792" y1="128" x2="792" y2="148" stroke="#94A3B8" stroke-width="3"/>
  <line x1="1080" y1="128" x2="1080" y2="148" stroke="#94A3B8" stroke-width="3"/>
  <text x="197" y="112" class="mono">0</text><text x="477" y="112" class="mono">1616</text><text x="768" y="112" class="mono">3232</text><text x="1054" y="112" class="mono">4538</text>

  <text x="64" y="228" class="head">MTP off</text>
  <rect x="208" y="188" width="292" height="82" rx="8" fill="#12405A" stroke="#38BDF8"/>
  <rect x="500" y="188" width="292" height="82" rx="8" fill="#145A4A" stroke="#22C55E"/>
  <rect x="792" y="188" width="288" height="82" rx="8" fill="#3D315A" stroke="#A78BFA"/>
  <text x="310" y="223" class="mono">step 1</text><text x="278" y="250" class="body">结束在 1616</text>
  <text x="602" y="223" class="mono">step 2</text><text x="570" y="250" class="body">结束在 3232</text>
  <text x="894" y="223" class="mono">step 3</text><text x="858" y="250" class="body">结束在 prompt tail</text>
  <circle cx="500" cy="300" r="12" fill="#38BDF8"/><circle cx="792" cy="300" r="12" fill="#22C55E"/>
  <text x="432" y="334" class="small">state_1616</text><text x="724" y="334" class="small">state_3232</text>

  <text x="64" y="438" class="head">MTP on</text>
  <rect x="208" y="398" width="292" height="82" rx="8" fill="#12405A" stroke="#38BDF8"/>
  <rect x="500" y="398" width="580" height="82" rx="8" fill="#713F12" stroke="#F59E0B"/>
  <text x="310" y="433" class="mono">step 1</text><text x="278" y="460" class="body">结束在 1616</text>
  <text x="726" y="433" class="mono">step 2</text><text x="641" y="460" class="body">从 1616 直接运行到 4538</text>
  <circle cx="500" cy="510" r="12" fill="#38BDF8"/>
  <circle cx="792" cy="510" r="12" fill="#0F172A" stroke="#F87171" stroke-width="3"/>
  <path d="M784 502L800 518M800 502L784 518" stroke="#F87171" stroke-width="3"/>
  <text x="432" y="544" class="small">state_1616</text><text x="676" y="544" class="small">没有 step 在 3232 结束，因此没有 state_3232</text>

  <path d="M792 352V390" stroke="#FDE68A" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="822" y="374" class="body">未来命中也会回退，所以不再额外切一刀</text>
  <rect x="190" y="604" width="820" height="56" rx="8" fill="#182638"/>
  <text x="226" y="638" class="body">关键不是“计算经过了 3232”，而是“有没有一个 step 恰好结束在 3232”。</text>
</svg>
