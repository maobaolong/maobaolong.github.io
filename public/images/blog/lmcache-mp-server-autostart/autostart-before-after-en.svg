```xml
<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Before and after LMCache MP server autostart</title>
  <desc id="desc">A side-by-side diagram showing manual MP server startup before PR 3476 and worker-0 autostart after PR 3476.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111F"/>
      <stop offset="1" stop-color="#13233A"/>
    </linearGradient>
    <linearGradient id="card" x1="74" y1="104" x2="1126" y2="556" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10243E"/>
      <stop offset="1" stop-color="#0B1B31"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2L10 6L2 10" stroke="#7DD3FC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title{font:700 34px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#F8FAFC}
      .label{font:700 22px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#E0F2FE}
      .body{font:500 17px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#B9D5EE}
      .mono{font:600 16px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#DCFCE7}
      .small{font:500 14px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#93AFC8}
    </style>
  </defs>
  <rect width="1200" height="620" rx="36" fill="url(#bg)"/>
  <text x="70" y="68" class="title">LMCache MP Server AutoStart: From "Two-step Startup" to "Simultaneous Startup"</text>
  <rect x="70" y="106" width="500" height="430" rx="28" fill="url(#card)" stroke="#254766" filter="url(#shadow)"/>
  <rect x="630" y="106" width="500" height="430" rx="28" fill="url(#card)" stroke="#256A65" filter="url(#shadow)"/>
  <text x="108" y="154" class="label">Before: Manually Managing MP Server</text>
  <text x="668" y="154" class="label">After: vLLM Worker 0 Started on Demand</text>
  <rect x="116" y="194" width="184" height="82" rx="18" fill="#172A46" stroke="#43627F"/>
  <text x="144" y="227" class="mono">Terminal 1</text>
  <text x="139" y="253" class="body">lmcache server</text>
  <rect x="340" y="194" width="184" height="82" rx="18" fill="#172A46" stroke="#43627F"/>
  <text x="368" y="227" class="mono">Terminal 2</text>
  <text x="389" y="253" class="body">vLLM serve</text>
  <path d="M300 235H336" stroke="#7DD3FC" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="124" y="326" class="body">The deployment script needs to start the LMCache MP server first,</text>
  <text x="124" y="354" class="body">and then start the vLLM connector to connect to it.</text>
  <text x="124" y="398" class="small">If the server is not up: vLLM will get stuck in the connection/alive check during initialization</text>
  <text x="124" y="428" class="small">Local testing, CI, and single-machine demos require additional process orchestration</text>
  <rect x="676" y="190" width="184" height="82" rx="18" fill="#102F3E" stroke="#22C55E"/>
  <text x="708" y="223" class="mono">vLLM Worker 0</text>
  <text x="723" y="249" class="body">maybe_start</text>
  <rect x="900" y="190" width="184" height="82" rx="18" fill="#103646" stroke="#38BDF8"/>
  <text x="932" y="223" class="mono">Child Process</text>
  <text x="933" y="249" class="body">MP Server</text>
  <path d="M860 231H896" stroke="#22C55E" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="790" y="318" width="184" height="82" rx="18" fill="#122B45" stroke="#7DD3FC"/>
  <text x="827" y="351" class="mono">Other Workers</text>
  <text x="839" y="377" class="body">Wait for PING</text>
  <path d="M883 318C885 294 913 279 943 270" stroke="#7DD3FC" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <text x="682" y="452" class="body">Only effective when autostart is explicitly enabled.</text>
  <text x="682" y="482" class="small">Default is still connect-only; existing deployments are not changed</text>
</svg>
