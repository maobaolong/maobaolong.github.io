<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d">
  <title id="t">一个 engine block 对应多个 kernel page</title>
  <desc id="d">配置块大小 128，kernel page 大小 64，因此每个 engine block 映射到两个连续 page。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#11213c"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".25"/></filter></defs>
  <rect width="1200" height="650" rx="32" fill="url(#bg)"/>
  <text x="70" y="72" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="34" font-weight="800">同一份 KV cache，有两套编号坐标</text>
  <text x="70" y="112" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="20">block_size = 128，kernel_block_size = 64，所以 k = 2</text>
  <text x="70" y="178" fill="#93c5fd" font-family="system-ui,sans-serif" font-size="19" font-weight="700">vLLM 调度 / block table</text>
  <g filter="url(#s)"><rect x="70" y="205" width="310" height="105" rx="18" fill="#16345f" stroke="#60a5fa"/><rect x="430" y="205" width="310" height="105" rx="18" fill="#16345f" stroke="#60a5fa"/><rect x="790" y="205" width="310" height="105" rx="18" fill="#16345f" stroke="#60a5fa"/></g>
  <g fill="#e0f2fe" font-family="ui-monospace,monospace" font-size="24" font-weight="700" text-anchor="middle"><text x="225" y="250">engine block 0</text><text x="585" y="250">engine block 1</text><text x="945" y="250">engine block b</text></g>
  <g fill="#bfdbfe" font-family="system-ui,sans-serif" font-size="17" text-anchor="middle"><text x="225" y="282">128 logical tokens</text><text x="585" y="282">128 logical tokens</text><text x="945" y="282">128 logical tokens</text></g>
  <g stroke="#38bdf8" stroke-width="4" fill="none"><path d="M190 320v45h-55v34"/><path d="M260 320v45h55v34"/><path d="M550 320v45h-55v34"/><path d="M620 320v45h55v34"/><path d="M910 320v45h-55v34"/><path d="M980 320v45h55v34"/></g>
  <text x="70" y="405" fill="#5eead4" font-family="system-ui,sans-serif" font-size="19" font-weight="700">attention kernel / tensor 第一维</text>
  <g filter="url(#s)" fill="#0f4c4d" stroke="#2dd4bf"><rect x="70" y="430" width="150" height="100" rx="16"/><rect x="230" y="430" width="150" height="100" rx="16"/><rect x="430" y="430" width="150" height="100" rx="16"/><rect x="590" y="430" width="150" height="100" rx="16"/><rect x="790" y="430" width="150" height="100" rx="16"/><rect x="950" y="430" width="150" height="100" rx="16"/></g>
  <g fill="#ccfbf1" font-family="ui-monospace,monospace" font-size="20" font-weight="700" text-anchor="middle"><text x="145" y="475">page 0</text><text x="305" y="475">page 1</text><text x="505" y="475">page 2</text><text x="665" y="475">page 3</text><text x="865" y="475">page 2b</text><text x="1025" y="475">page 2b+1</text></g>
  <g fill="#99f6e4" font-family="system-ui,sans-serif" font-size="16" text-anchor="middle"><text x="145" y="505">64 slots</text><text x="305" y="505">64 slots</text><text x="505" y="505">64 slots</text><text x="665" y="505">64 slots</text><text x="865" y="505">64 slots</text><text x="1025" y="505">64 slots</text></g>
  <rect x="70" y="565" width="1030" height="48" rx="14" fill="#0f172a" stroke="#334155"/><text x="585" y="597" fill="#e2e8f0" font-family="ui-monospace,monospace" font-size="20" text-anchor="middle">engine block b  →  pages [b × k, b × k + 1, …, b × k + k − 1]</text>
</svg>
