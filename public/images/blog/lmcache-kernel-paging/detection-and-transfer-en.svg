<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="t d">
  <title id="t">Detection and transfer boundary in PR 6019</title><desc id="d">Registration detects k from page and block counts. Control logic remains in block IDs, while gather and scatter use expanded page IDs.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#14213a"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0l9 3-9 3z" fill="#38bdf8"/></marker></defs><rect width="1200" height="690" rx="32" fill="url(#bg)"/>
  <text x="65" y="70" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="34" font-weight="800">Detect the coordinate system, then expand at the copy boundary</text>
  <g font-family="system-ui,sans-serif"><rect x="65" y="120" width="320" height="190" rx="22" fill="#122c4f" stroke="#60a5fa"/><text x="95" y="162" fill="#bfdbfe" font-size="22" font-weight="800">Registration</text><text x="95" y="202" fill="#e2e8f0" font-size="18">tensor pages = 2N</text><text x="95" y="235" fill="#e2e8f0" font-size="18">engine num_blocks = N</text><text x="95" y="268" fill="#e2e8f0" font-size="18">64 slots × 2 = 128 tokens</text><text x="95" y="298" fill="#5eead4" font-size="18" font-weight="700">⇒ kernel_pages_per_block = 2</text>
  <rect x="440" y="120" width="320" height="190" rx="22" fill="#263148" stroke="#94a3b8"/><text x="470" y="162" fill="#e2e8f0" font-size="22" font-weight="800">Control logic</text><text x="470" y="202" fill="#cbd5e1" font-size="18">chunk count</text><text x="470" y="235" fill="#cbd5e1" font-size="18">null-chunk detection</text><text x="470" y="268" fill="#cbd5e1" font-size="18">retrieve window</text><text x="470" y="298" fill="#fde68a" font-size="18" font-weight="700">still counts engine block IDs</text>
  <rect x="815" y="120" width="320" height="190" rx="22" fill="#0f4c4d" stroke="#2dd4bf"/><text x="845" y="162" fill="#ccfbf1" font-size="22" font-weight="800">Data movement</text><text x="845" y="202" fill="#d1fae5" font-size="18">gather / scatter</text><text x="845" y="235" fill="#d1fae5" font-size="18">CUDA transfer kernel</text><text x="845" y="275" fill="#5eead4" font-size="19" font-weight="700">[3, 7] → [6, 7, 14, 15]</text></g><g stroke="#38bdf8" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M385 215h45"/><path d="M760 215h45"/></g>
  <text x="65" y="380" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="27" font-weight="800">Three quantities that must not be conflated</text>
  <g font-family="system-ui,sans-serif"><rect x="65" y="415" width="335" height="190" rx="20" fill="#141f35" stroke="#334155"/><text x="95" y="458" fill="#93c5fd" font-size="21" font-weight="800">tokens_per_block</text><text x="95" y="497" fill="#cbd5e1" font-size="17">logical tokens covered by</text><text x="95" y="526" fill="#cbd5e1" font-size="17">one scheduler block ID</text><text x="95" y="570" fill="#f8fafc" font-size="27" font-weight="800">128</text>
  <rect x="432" y="415" width="335" height="190" rx="20" fill="#141f35" stroke="#334155"/><text x="462" y="458" fill="#5eead4" font-size="21" font-weight="800">slots_per_page</text><text x="462" y="497" fill="#cbd5e1" font-size="17">physical slots in one</text><text x="462" y="526" fill="#cbd5e1" font-size="17">tensor page</text><text x="462" y="570" fill="#f8fafc" font-size="27" font-weight="800">64</text>
  <rect x="800" y="415" width="335" height="190" rx="20" fill="#141f35" stroke="#334155"/><text x="830" y="458" fill="#f0abfc" font-size="21" font-weight="800">slots_per_engine_block</text><text x="830" y="497" fill="#cbd5e1" font-size="17">all physical slots behind</text><text x="830" y="526" fill="#cbd5e1" font-size="17">one engine block ID</text><text x="830" y="570" fill="#f8fafc" font-size="27" font-weight="800">64 × 2 = 128</text></g>
  <text x="600" y="652" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="17" text-anchor="middle">Kernel paging is not slot compression: one splits a block across pages; the other truly stores fewer slots.</text>
</svg>
