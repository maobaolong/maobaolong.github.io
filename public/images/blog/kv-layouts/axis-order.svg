<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">KV cache layout axis order</title>
  <desc id="desc">A comparison of NHD, HND, BLNHC and BLHNC physical axis order.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10213b"/>
      <stop offset="1" stop-color="#071221"/>
    </linearGradient>
    <style>
      .bg{fill:#07111f}.panel{fill:url(#panel);stroke:#315173;stroke-width:1.2;filter:url(#shadow)}
      .title{fill:#eef4ff;font:700 34px Arial,sans-serif}.subtitle{fill:#9eb0cb;font:18px Arial,sans-serif}
      .label{fill:#eef4ff;font:700 22px Arial,sans-serif}.note{fill:#adc0df;font:16px Arial,sans-serif}
      .axis{font:700 22px Arial,sans-serif;fill:#06111f}.small{font:600 14px Arial,sans-serif;fill:#06111f}
      .chip{stroke:#d7ecff;stroke-opacity:.32;stroke-width:1}
      .legend{fill:#9eb0cb;font:15px Arial,sans-serif}.arrow{stroke:#5ce1e6;stroke-width:3;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#5ce1e6"/>
    </marker>
  </defs>
  <rect class="bg" width="1120" height="640"/>
  <text class="title" x="48" y="60">KV layout name 其实是在说“哪根轴在内存里先走”</text>
  <text class="subtitle" x="48" y="94">vLLM 的标准逻辑轴是 [L, B, H, N, C]：Layer、Block、Head、block 内 token/state、content。</text>

  <g transform="translate(48 135)">
    <rect class="panel" x="0" y="0" width="500" height="190" rx="18"/>
    <text class="label" x="24" y="42">NHD / LBNHC</text>
    <text class="note" x="24" y="72">每个 layer 内：block -> token/state -> head -> content</text>
    <g transform="translate(24 105)">
      <rect class="chip" x="0" y="0" width="70" height="54" rx="12" fill="#f6b73c"/><text class="axis" x="25" y="35">L</text>
      <rect class="chip" x="82" y="0" width="70" height="54" rx="12" fill="#74d680"/><text class="axis" x="107" y="35">B</text>
      <rect class="chip" x="164" y="0" width="70" height="54" rx="12" fill="#5ce1e6"/><text class="axis" x="189" y="35">N</text>
      <rect class="chip" x="246" y="0" width="70" height="54" rx="12" fill="#ff8e82"/><text class="axis" x="271" y="35">H</text>
      <rect class="chip" x="328" y="0" width="70" height="54" rx="12" fill="#b7a4ff"/><text class="axis" x="353" y="35">C</text>
    </g>
    <text class="legend" x="24" y="176">适合 token-major 访问：同一个 token 的所有 head 内容挨得近。</text>
  </g>

  <g transform="translate(572 135)">
    <rect class="panel" x="0" y="0" width="500" height="190" rx="18"/>
    <text class="label" x="24" y="42">HND / LBHNC</text>
    <text class="note" x="24" y="72">每个 layer 内：block -> head -> token/state -> content</text>
    <g transform="translate(24 105)">
      <rect class="chip" x="0" y="0" width="70" height="54" rx="12" fill="#f6b73c"/><text class="axis" x="25" y="35">L</text>
      <rect class="chip" x="82" y="0" width="70" height="54" rx="12" fill="#74d680"/><text class="axis" x="107" y="35">B</text>
      <rect class="chip" x="164" y="0" width="70" height="54" rx="12" fill="#ff8e82"/><text class="axis" x="189" y="35">H</text>
      <rect class="chip" x="246" y="0" width="70" height="54" rx="12" fill="#5ce1e6"/><text class="axis" x="271" y="35">N</text>
      <rect class="chip" x="328" y="0" width="70" height="54" rx="12" fill="#b7a4ff"/><text class="axis" x="353" y="35">C</text>
    </g>
    <text class="legend" x="24" y="176">适合 head-major 访问和按 head 做 TP 切分、RDMA 分段。</text>
  </g>

  <g transform="translate(48 370)">
    <rect class="panel" x="0" y="0" width="500" height="190" rx="18"/>
    <text class="label" x="24" y="42">BLNHC</text>
    <text class="note" x="24" y="72">block 放到最外层：block -> layer -> token/state -> head -> content</text>
    <g transform="translate(24 105)">
      <rect class="chip" x="0" y="0" width="70" height="54" rx="12" fill="#74d680"/><text class="axis" x="25" y="35">B</text>
      <rect class="chip" x="82" y="0" width="70" height="54" rx="12" fill="#f6b73c"/><text class="axis" x="107" y="35">L</text>
      <rect class="chip" x="164" y="0" width="70" height="54" rx="12" fill="#5ce1e6"/><text class="axis" x="189" y="35">N</text>
      <rect class="chip" x="246" y="0" width="70" height="54" rx="12" fill="#ff8e82"/><text class="axis" x="271" y="35">H</text>
      <rect class="chip" x="328" y="0" width="70" height="54" rx="12" fill="#b7a4ff"/><text class="axis" x="353" y="35">C</text>
    </g>
    <text class="legend" x="24" y="176">适合把多个 layer/group 的 page 打包到同一个 block allocation 里。</text>
  </g>

  <g transform="translate(572 370)">
    <rect class="panel" x="0" y="0" width="500" height="190" rx="18"/>
    <text class="label" x="24" y="42">BLHNC</text>
    <text class="note" x="24" y="72">block -> layer -> head -> token/state -> content</text>
    <g transform="translate(24 105)">
      <rect class="chip" x="0" y="0" width="70" height="54" rx="12" fill="#74d680"/><text class="axis" x="25" y="35">B</text>
      <rect class="chip" x="82" y="0" width="70" height="54" rx="12" fill="#f6b73c"/><text class="axis" x="107" y="35">L</text>
      <rect class="chip" x="164" y="0" width="70" height="54" rx="12" fill="#ff8e82"/><text class="axis" x="189" y="35">H</text>
      <rect class="chip" x="246" y="0" width="70" height="54" rx="12" fill="#5ce1e6"/><text class="axis" x="271" y="35">N</text>
      <rect class="chip" x="328" y="0" width="70" height="54" rx="12" fill="#b7a4ff"/><text class="axis" x="353" y="35">C</text>
    </g>
    <text class="legend" x="24" y="176">把 block-first 和 head-major 放到一起，常见于 mixed page / sparse sidecar。</text>
  </g>
</svg>
