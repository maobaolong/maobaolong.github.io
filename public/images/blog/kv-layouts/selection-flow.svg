<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="660" viewBox="0 0 1180 660" role="img" aria-labelledby="title desc">
  <title id="title">vLLM KV layout selection before allocation</title>
  <desc id="desc">Animation showing that backend support, user configuration, and model attention type converge in engine core before worker KV cache allocation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#1f2933"/>
      <stop offset="1" stop-color="#0d1320"/>
    </linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#8190a3"/>
    </marker>
    <style>
      .title { fill: #f8fafc; font: 800 31px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .sub { fill: #aab7c6; font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .box { fill: #17212e; stroke: #4e6178; stroke-width: 1.3; }
      .box-core { fill: #27334a; stroke: #9dc4ff; stroke-width: 2; }
      .box-out { fill: #142b25; stroke: #65d2a3; stroke-width: 1.6; }
      .box-worker { fill: #2f2637; stroke: #d4a6ff; stroke-width: 1.6; }
      .head { fill: #eef5fb; font: 800 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { fill: #cbd5df; font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .micro { fill: #94a3b8; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .edge { fill: none; stroke: #8190a3; stroke-width: 2.4; stroke-linecap: round; marker-end: url(#arrow); }
      .edge-lit { fill: none; stroke: #e7f6ff; stroke-width: 5; stroke-linecap: round; opacity: .22; stroke-dasharray: 14 420; filter: url(#glow); }
      .packet { fill: #eaf8ff; filter: url(#glow); }
      .pulse { fill: none; stroke: #b7d7ff; stroke-width: 3; opacity: 0; }
      .badge { fill: #0f1722; stroke: #5f7082; }
      .badge-text { fill: #d8e4ef; font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .step { fill: #0d1118; stroke: #3d4b5b; stroke-width: 1; }
      .step-on { fill: #c8f7d9; opacity: 0; }
    </style>
  </defs>

  <rect width="1180" height="660" rx="28" fill="url(#bg)"/>
  <text class="title" x="54" y="58">layout 在 engine core 中解析，早于 KV cache 分配</text>
  <text class="sub" x="56" y="88">动画里的三股输入先汇入 resolver；只有输出变成 resolved layout 后，worker 才开始创建 KV cache view。</text>

  <g transform="translate(70,145)">
    <rect class="box" width="245" height="120" rx="16"/>
    <text class="head" x="22" y="35">backend 支持集</text>
    <text class="body" x="22" y="67">device / attention</text>
    <text class="body" x="22" y="91">能接受哪些 layout</text>
  </g>
  <g transform="translate(70,314)">
    <rect class="box" width="245" height="120" rx="16"/>
    <text class="head" x="22" y="35">外部输入</text>
    <text class="body" x="22" y="67">默认值 / 用户配置</text>
    <text class="body" x="22" y="91">以及兼容约束</text>
  </g>
  <g transform="translate(70,483)">
    <rect class="box" width="245" height="105" rx="16"/>
    <text class="head" x="22" y="34">模型形态</text>
    <text class="body" x="22" y="66">MHA / GQA / MLA</text>
    <text class="body" x="22" y="90">影响可用实现</text>
  </g>

  <g transform="translate(438,241)">
    <rect class="box-core" width="290" height="178" rx="20"/>
    <text class="head" x="145" y="42" text-anchor="middle">engine core</text>
    <text class="body" x="145" y="76" text-anchor="middle">resolve_kv_cache_layout</text>
    <g transform="translate(45,104)">
      <rect class="step" x="0" y="0" width="46" height="34" rx="8"/>
      <rect class="step" x="62" y="0" width="46" height="34" rx="8"/>
      <rect class="step" x="124" y="0" width="46" height="34" rx="8"/>
      <rect class="step" x="186" y="0" width="46" height="34" rx="8"/>
      <rect class="step-on" x="0" y="0" width="46" height="34" rx="8"><animate attributeName="opacity" values="0;1;0" begin="0s" dur="2.4s" repeatCount="indefinite"/></rect>
      <rect class="step-on" x="62" y="0" width="46" height="34" rx="8"><animate attributeName="opacity" values="0;1;0" begin=".45s" dur="2.4s" repeatCount="indefinite"/></rect>
      <rect class="step-on" x="124" y="0" width="46" height="34" rx="8"><animate attributeName="opacity" values="0;1;0" begin=".9s" dur="2.4s" repeatCount="indefinite"/></rect>
      <rect class="step-on" x="186" y="0" width="46" height="34" rx="8"><animate attributeName="opacity" values="0;1;0" begin="1.35s" dur="2.4s" repeatCount="indefinite"/></rect>
      <text class="micro" x="23" y="23" text-anchor="middle">候选</text>
      <text class="micro" x="85" y="23" text-anchor="middle">过滤</text>
      <text class="micro" x="147" y="23" text-anchor="middle">选择</text>
      <text class="micro" x="209" y="23" text-anchor="middle">冻结</text>
    </g>
  </g>

  <g transform="translate(858,170)">
    <rect class="box-out" width="250" height="118" rx="16"/>
    <text class="head" x="22" y="36">CacheConfig</text>
    <text class="body" x="22" y="69">kv_cache_layout</text>
    <text class="body" x="22" y="93">已经是 resolved 值</text>
  </g>
  <g transform="translate(858,392)">
    <rect class="box-worker" width="250" height="135" rx="16"/>
    <text class="head" x="22" y="38">worker</text>
    <text class="body" x="22" y="72">按 resolved layout</text>
    <text class="body" x="22" y="96">分配 KV cache view</text>
  </g>

  <path class="edge" d="M315 205 C365 205 382 275 438 294"/>
  <path class="edge" d="M315 374 C372 374 388 346 438 332"/>
  <path class="edge" d="M315 535 C370 522 390 410 438 382"/>
  <path class="edge" d="M728 297 C790 280 810 229 858 229"/>
  <path class="edge" d="M983 288 C983 335 983 352 983 392"/>
  <path class="edge" d="M728 372 C790 392 812 451 858 459"/>

  <path class="edge-lit" d="M315 205 C365 205 382 275 438 294">
    <animate attributeName="stroke-dashoffset" values="430;0" dur="3s" repeatCount="indefinite"/>
  </path>
  <path class="edge-lit" d="M315 374 C372 374 388 346 438 332">
    <animate attributeName="stroke-dashoffset" values="430;0" begin=".45s" dur="3s" repeatCount="indefinite"/>
  </path>
  <path class="edge-lit" d="M315 535 C370 522 390 410 438 382">
    <animate attributeName="stroke-dashoffset" values="430;0" begin=".9s" dur="3s" repeatCount="indefinite"/>
  </path>

  <circle class="packet" r="7">
    <animateMotion dur="3s" repeatCount="indefinite" path="M315 205 C365 205 382 275 438 294"/>
  </circle>
  <circle class="packet" r="7">
    <animateMotion begin=".45s" dur="3s" repeatCount="indefinite" path="M315 374 C372 374 388 346 438 332"/>
  </circle>
  <circle class="packet" r="7">
    <animateMotion begin=".9s" dur="3s" repeatCount="indefinite" path="M315 535 C370 522 390 410 438 382"/>
  </circle>
  <circle class="packet" r="8" fill="#c8f7d9">
    <animateMotion begin="1.7s" dur="3s" repeatCount="indefinite" path="M728 297 C790 280 810 229 858 229"/>
  </circle>
  <circle class="packet" r="8" fill="#e9d5ff">
    <animateMotion begin="2.2s" dur="3s" repeatCount="indefinite" path="M728 372 C790 392 812 451 858 459"/>
  </circle>

  <rect class="pulse" x="434" y="237" width="298" height="186" rx="24">
    <animate attributeName="opacity" values="0;.85;0" begin="1.1s" dur="2.2s" repeatCount="indefinite"/>
  </rect>
  <rect class="pulse" x="854" y="166" width="258" height="126" rx="20">
    <animate attributeName="opacity" values="0;.75;0" begin="2s" dur="2.2s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(858,560)">
    <rect class="badge" width="250" height="42" rx="12"/>
    <text class="badge-text" x="125" y="27" text-anchor="middle">先解析，再分配</text>
  </g>
</svg>
