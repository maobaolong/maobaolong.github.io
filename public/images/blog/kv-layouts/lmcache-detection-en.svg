```xml
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="650" viewBox="0 0 1180 650" role="img" aria-labelledby="title desc">
  <title id="title">LMCache KV layout discovery animation</title>
  <desc id="desc">Animation showing LMCache combining raw tensor shape and stride with vLLM resolved layout hints to remove ambiguity and produce an internal engine KV format.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14181f"/>
      <stop offset="0.55" stop-color="#1e2b31"/>
      <stop offset="1" stop-color="#0f141c"/>
    </linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#8294a6"/>
    </marker>
    <style>
      .title { fill: #f8fafc; font: 800 31px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .sub { fill: #a8b5c3; font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .panel { fill: #17212a; stroke: #536779; stroke-width: 1.3; }
      .panel-hint { fill: #1c2437; stroke: #9db8ff; stroke-width: 1.5; }
      .panel-core { fill: #263943; stroke: #9de6d2; stroke-width: 2; }
      .panel-out { fill: #173221; stroke: #86efac; stroke-width: 1.7; }
      .head { fill: #f1f5f9; font: 800 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { fill: #d5dee7; font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .micro { fill: #9fb0bf; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .axis { fill: #253342; stroke: #65778a; }
      .axis-lit { fill: #e4faff; opacity: 0; filter: url(#glow); }
      .edge { fill: none; stroke: #8294a6; stroke-width: 2.4; stroke-linecap: round; marker-end: url(#arrow); }
      .token { fill: #effcff; filter: url(#glow); }
      .hint-token { fill: #dbe6ff; filter: url(#glow); }
      .badge { fill: #0f1722; stroke: #4a5a68; }
      .badge-text { fill: #dbeafe; font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .scan { fill: none; stroke: #f8fbff; stroke-width: 3.5; filter: url(#glow); }
      .ambig { fill: #372821; stroke: #d79f62; stroke-width: 1.3; }
      .resolved { fill: #163327; stroke: #75d99d; stroke-width: 1.3; }
      .faint { opacity: .35; }
    </style>
  </defs>

  <rect width="1180" height="650" rx="28" fill="url(#bg)"/>
  <text class="title" x="54" y="58">LMCache is not guessing names, but disambiguating between shape/stride and hints</text>
  <text class="sub" x="56" y="88">The animation shows the raw KV cache being scanned; when both interpretations are possible, the vLLM resolved layout hint will lock the format.</text>

  <g transform="translate(60,150)">
    <rect class="panel" width="286" height="178" rx="18"/>
    <text class="head" x="24" y="38">raw KV cache</text>
    <text class="body" x="24" y="70">shape / stride / nesting</text>
    <g transform="translate(28,96)">
      <rect class="axis" x="0" y="0" width="42" height="42" rx="8"/><rect class="axis" x="52" y="0" width="42" height="42" rx="8"/><rect class="axis" x="104" y="0" width="42" height="42" rx="8"/><rect class="axis" x="156" y="0" width="42" height="42" rx="8"/><rect class="axis" x="208" y="0" width="42" height="42" rx="8"/>
      <rect class="axis-lit" x="0" y="0" width="42" height="42" rx="8"><animate attributeName="opacity" values="0;1;0" begin="0s" dur="2s" repeatCount="indefinite"/></rect>
      <rect class="axis-lit" x="52" y="0" width="42" height="42" rx="8"><animate attributeName="opacity" values="0;1;0" begin=".25s" dur="2s" repeatCount="indefinite"/></rect>
      <rect class="axis-lit" x="104" y="0" width="42" height="42" rx="8"><animate attributeName="opacity" values="0;1;0" begin=".5s" dur="2s" repeatCount="indefinite"/></rect>
      <rect class="axis-lit" x="156" y="0" width="42" height="42" rx="8"><animate attributeName="opacity" values="0;1;0" begin=".75s" dur="2s" repeatCount="indefinite"/></rect>
      <rect class="axis-lit" x="208" y="0" width="42" height="42" rx="8"><animate attributeName="opacity" values="0;1;0" begin="1s" dur="2s" repeatCount="indefinite"/></rect>
      <rect class="scan" x="-3" y="-3" width="48" height="48" rx="10">
        <animate attributeName="x" values="-3;49;101;153;205;-3" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <g transform="translate(60,392)">
    <rect class="panel-hint" width="286" height="130" rx="18"/>
    <text class="head" x="24" y="38">vLLM hint</text>
    <text class="body" x="24" y="70">resolved layout name</text>
    <text class="body" x="24" y="95">from engine core</text>
  </g>

  <g transform="translate(455,230)">
    <rect class="panel-core" width="286" height="178" rx="20"/>
    <text class="head" x="143" y="42" text-anchor="middle">normalize + discover</text>
    <text class="body" x="143" y="76" text-anchor="middle">first look at tensor evidence</text>
    <text class="body" x="143" y="101" text-anchor="middle">then disambiguate using hints</text>
    <g transform="translate(52,128)">
      <rect class="badge" width="74" height="32" rx="9"/>
      <rect class="badge" x="104" width="74" height="32" rx="9"/>
      <text class="badge-text" x="37" y="21" text-anchor="middle">shape</text>
      <text class="badge-text" x="141" y="21" text-anchor="middle">layout</text>
    </g>
  </g>

  <g transform="translate(838,142)">
    <rect class="ambig" width="280" height="135" rx="18"/>
    <text class="head" x="24" y="39">Possible ambiguity</text>
    <text class="body" x="24" y="72">same rank/shape</text>
    <text class="body" x="24" y="96">may correspond to different semantics</text>
  </g>

  <g transform="translate(838,369)">
    <rect class="panel-out" width="280" height="146" rx="18"/>
    <text class="head" x="24" y="39">EngineKVFormat</text>
    <text class="body" x="24" y="73">unified internal description</text>
    <text class="body" x="24" y="98">to be used in subsequent transfers</text>
  </g>

  <path class="edge" d="M346 239 C394 246 412 283 455 303"/>
  <path class="edge" d="M346 457 C398 449 417 376 455 346"/>
  <path class="edge" d="M741 291 C789 262 801 217 838 208"/>
  <path class="edge" d="M741 353 C789 365 802 432 838 444"/>

  <circle class="token" r="8">
    <animateMotion dur="3.6s" repeatCount="indefinite" path="M346 239 C394 246 412 283 455 303"/>
  </circle>
  <circle class="hint-token" r="8">
    <animateMotion begin=".9s" dur="3.6s" repeatCount="indefinite" path="M346 457 C398 449 417 376 455 346"/>
  </circle>
  <circle class="token" r="8" fill="#f6c177">
    <animateMotion begin="1.8s" dur="3.6s" repeatCount="indefinite" path="M741 291 C789 262 801 217 838 208"/>
  </circle>
  <circle class="token" r="8" fill="#86efac">
    <animateMotion begin="2.2s" dur="3.6s" repeatCount="indefinite" path="M741 353 C789 365 802 432 838 444"/>
  </circle>

  <g transform="translate(875,303)">
    <rect class="badge" width="206" height="38" rx="11"/>
    <text class="badge-text" x="103" y="24" text-anchor="middle">hint locks the candidates into one</text>
  </g>
  <g class="faint" transform="translate(890,244)">
    <rect class="badge" width="72" height="28" rx="8"/>
    <rect class="badge" x="92" width="72" height="28" rx="8"/>
    <text class="badge-text" x="36" y="19" text-anchor="middle">NHD?</text>
    <text class="badge-text" x="128" y="19" text-anchor="middle">HND?</text>
  </g>
  <g transform="translate(900,480)">
    <rect class="badge" width="66" height="30" rx="9"/>
    <rect class="badge" x="82" width="72" height="30" rx="9"/>
    <text class="badge-text" x="33" y="20" text-anchor="middle">rank</text>
    <text class="badge-text" x="118" y="20" text-anchor="middle">strides</text>
  </g>
</svg>
