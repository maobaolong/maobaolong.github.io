```xml
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="660" viewBox="0 0 1180 660" role="img" aria-labelledby="title desc">
  <title id="title">KV layout conversion cost map</title>
  <desc id="desc">Animated map separating metadata-only views, physical data reorder, name translation, and unsupported fragmented layouts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121722"/>
      <stop offset=".56" stop-color="#20282e"/>
      <stop offset="1" stop-color="#10151c"/>
    </linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#8190a3"/>
    </marker>
    <style>
      .title { fill: #f8fafc; font: 800 31px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .sub { fill: #a9b6c4; font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .panel { fill: #17212a; stroke: #526578; stroke-width: 1.25; }
      .green { fill: #132f25; stroke: #6dd6a0; }
      .yellow { fill: #382d19; stroke: #e6bd67; }
      .blue { fill: #17273d; stroke: #8bb8ff; }
      .red { fill: #361f25; stroke: #f19aa7; }
      .head { fill: #f3f7fb; font: 800 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { fill: #d3dde7; font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .micro { fill: #9fb0bf; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .chip { fill: #0f1722; stroke: #536577; }
      .chip-text { fill: #dbe7f1; font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .edge { fill: none; stroke: #8190a3; stroke-width: 2.2; marker-end: url(#arrow); }
      .pulse { fill: #e9fbff; filter: url(#glow); opacity: .9; }
      .ghost { fill: none; stroke: #edf7ff; stroke-width: 3; opacity: 0; filter: url(#glow); }
      .cell { fill: #2b3644; stroke: #5b6b7b; }
      .cell-hot { fill: #e9fbff; opacity: 0; filter: url(#glow); }
      .warn { fill: none; stroke: #f7a3b1; stroke-width: 4; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1180" height="660" rx="28" fill="url(#bg)"/>
  <text class="title" x="54" y="58">Before considering layout "conversion": Are we just changing perspectives, or moving data?</text>
  <text class="sub" x="56" y="88">The four quadrants display metadata view, physical reordering, name translation, and unsupported fragmented layouts by the transfer kernel.</text>

  <g transform="translate(64,136)">
    <rect class="panel green" width="500" height="200" rx="18"/>
    <text class="head" x="26" y="40">metadata-only view</text>
    <text class="body" x="26" y="72">Shape/stride is sufficient to express the new perspective</text>
    <text class="body" x="26" y="97">No need to copy KV payload</text>
    <g transform="translate(30,126)">
      <rect class="chip" width="80" height="34" rx="9"/><text class="chip-text" x="40" y="22" text-anchor="middle">view A</text>
      <path class="edge" d="M92 17 L190 17"/>
      <rect class="chip" x="204" width="80" height="34" rx="9"/><text class="chip-text" x="244" y="22" text-anchor="middle">view B</text>
      <rect class="ghost" x="-3" y="-3" width="86" height="40" rx="11">
        <animate attributeName="x" values="-3;201;-3" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="3.2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <g transform="translate(616,136)">
    <rect class="panel yellow" width="500" height="200" rx="18"/>
    <text class="head" x="26" y="40">physical reorder</text>
    <text class="body" x="26" y="72">Target layout requires different continuity</text>
    <text class="body" x="26" y="97">Must write new tensor</text>
    <g transform="translate(38,126)">
      <rect class="cell" x="0" y="0" width="34" height="34" rx="7"/>
      <rect class="cell" x="42" y="0" width="34" height="34" rx="7"/>
      <rect class="cell" x="84" y="0" width="34" height="34" rx="7"/>
      <rect class="cell" x="126" y="0" width="34" height="34" rx="7"/>
      <path class="edge" d="M178 17 L260 17"/>
      <rect class="cell" x="292" y="0" width="34" height="34" rx="7"/>
      <rect class="cell" x="334" y="0" width="34" height="34" rx="7"/>
      <rect class="cell" x="376" y="0" width="34" height="34" rx="7"/>
      <rect class="cell" x="418" y="0" width="34" height="34" rx="7"/>
      <rect class="cell-hot" x="0" y="0" width="34" height="34" rx="7">
        <animate attributeName="x" values="0;376;0" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="3.4s" repeatCount="indefinite"/>
      </rect>
      <rect class="cell-hot" x="42" y="0" width="34" height="34" rx="7">
        <animate attributeName="x" values="42;292;42" begin=".25s" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" begin=".25s" dur="3.4s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <g transform="translate(64,386)">
    <rect class="panel blue" width="500" height="200" rx="18"/>
    <text class="head" x="26" y="40">name translation</text>
    <text class="body" x="26" y="72">Different systems use different names</text>
    <text class="body" x="26" y="97">Internal semantics remain consistent</text>
    <g transform="translate(28,126)">
      <rect class="chip" width="98" height="34" rx="9"/><text class="chip-text" x="49" y="22" text-anchor="middle">vLLM</text>
      <path class="edge" d="M112 17 L214 17"/>
      <rect class="chip" x="232" width="112" height="34" rx="9"/><text class="chip-text" x="288" y="22" text-anchor="middle">LMCache</text>
      <circle class="pulse" r="8">
        <animateMotion dur="3.1s" repeatCount="indefinite" path="M112 17 L214 17"/>
      </circle>
    </g>
  </g>

  <g transform="translate(616,386)">
    <rect class="panel red" width="500" height="200" rx="18"/>
    <text class="head" x="26" y="40">unsupported fragmentation</text>
    <text class="body" x="26" y="72">Stride/block semantics do not match</text>
    <text class="body" x="26" y="97">Transfer kernel cannot move directly</text>
    <g transform="translate(36,126)">
      <rect class="cell" x="0" y="0" width="34" height="34" rx="7"/>
      <rect class="cell" x="58" y="0" width="34" height="34" rx="7"/>
      <rect class="cell" x="124" y="0" width="34" height="34" rx="7"/>
      <path class="edge" d="M178 17 L260 17"/>
      <rect class="cell" x="294" y="0" width="34" height="34" rx="7"/>
      <rect class="cell" x="352" y="0" width="34" height="34" rx="7"/>
      <path class="warn" d="M216 -2 L252 36"/>
      <path class="warn" d="M252 -2 L216 36"/>
      <rect class="ghost" x="-4" y="-4" width="42" height="42" rx="9">
        <animate attributeName="x" values="-4;58;124;124" keyTimes="0;0.32;0.64;1" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="3.6s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <g transform="translate(480,328)">
    <rect class="chip" width="220" height="46" rx="14"/>
    <text class="chip-text" x="110" y="29" text-anchor="middle">First assess the cost, then discuss conversion</text>
  </g>
</svg>
