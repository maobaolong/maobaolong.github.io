        <rect class="cell-on" x="53" y="15" width="28" height="34" rx="6"><animate attributeName="opacity" values="0;1;0" begin="0.2s" dur="1.2s" repeatCount="indefinite"/></rect>
        <rect class="cell-on" x="91" y="15" width="28" height="34" rx="6"><animate attributeName="opacity" values="0;1;0" begin="0.4s" dur="1.2s" repeatCount="indefinite"/></rect>
        <rect class="cell-on" x="129" y="15" width="28" height="34" rx="6"><animate attributeName="opacity" values="0;1;0" begin="0.6s" dur="1.2s" repeatCount="indefinite"/></rect>
        <rect class="cell-on" x="167" y="15" width="28" height="34" rx="6"><animate attributeName="opacity" values="0;1;0" begin="0.8s" dur="1.2s" repeatCount="indefinite"/></rect>
        <rect class="cell-on" x="205" y="15" width="28" height="34" rx="6"><animate attributeName="opacity" values="0;1;0" begin="1.0s" dur="1.2s" repeatCount="indefinite"/></rect>
        <rect class="cell-on" x="243" y="15" width="28" height="34" rx="6"><animate attributeName="opacity" values="0;1;0" begin="1.2s" dur="1.2s" repeatCount="indefinite"/></rect>
      </g>
    </g>
  </g>

