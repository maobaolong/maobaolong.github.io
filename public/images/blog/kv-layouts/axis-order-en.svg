      <rect class="axis d" x="312" y="16" width="134" height="84" rx="14"/><text class="axis-text" x="379" y="66" text-anchor="middle">D</text>
      <rect class="cursor" x="-2" y="14" width="138" height="88" rx="15">
        <animate attributeName="x" values="-2;154;310;-2" keyTimes="0;0.34;0.68;1" dur="4.8s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g transform="translate(764,23)">
      <rect class="track" x="0" y="0" width="298" height="64" rx="14"/>
      <g>
        <rect class="cell" x="15" y="15" width="28" height="34" rx="6"/>
