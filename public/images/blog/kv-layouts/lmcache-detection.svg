<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc">
  <title id="title">LMCache KV format detection boundary</title>
  <desc id="desc">LMCache maps runtime layout hints and raw tensor structures to EngineKVFormat, then transfer kernels use format facts.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity=".45"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#5ce1e6"/>
    </marker>
    <style>
      .bg{fill:#07111f}.box{fill:#0d1b31;stroke:#315173;stroke-width:1.2;filter:url(#shadow)}
      .green{fill:#10291f;stroke:#74d680}.gold{fill:#342713;stroke:#f6b73c}.red{fill:#351e24;stroke:#ff8e82}
      .title{fill:#eef4ff;font:700 34px Arial,sans-serif}.sub{fill:#9eb0cb;font:18px Arial,sans-serif}
      .h{fill:#eef4ff;font:700 20px Arial,sans-serif}.t{fill:#adc0df;font:16px Arial,sans-serif}
      .mono{fill:#5ce1e6;font:700 15px monospace}.arrow{stroke:#5ce1e6;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .mini{fill:#9eb0cb;font:14px Arial,sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1120" height="600"/>
  <text class="title" x="48" y="60">LMCache：layout 不是到处猜，而是先规整成 EngineKVFormat</text>
  <text class="sub" x="48" y="94">vLLM 负责告诉“已解析出的 layout”，LMCache 负责识别“这个 engine 实际递给我的张量结构”。</text>

  <g transform="translate(58 148)">
    <rect class="box" x="0" y="0" width="285" height="120" rx="18"/>
    <text class="h" x="22" y="36">Engine adapter</text>
    <text class="t" x="22" y="66">传入 raw KV cache</text>
    <text class="mono" x="22" y="92">tensor / list / nested list</text>
  </g>
  <path class="arrow" d="M343 208 H420"/>
  <g transform="translate(420 148)">
    <rect class="box green" x="0" y="0" width="285" height="120" rx="18"/>
    <text class="h" x="22" y="36">zero-copy view recovery</text>
    <text class="t" x="22" y="66">按 stride 排序恢复物理维度</text>
    <text class="mono" x="22" y="92">不调用 contiguous()</text>
  </g>
  <path class="arrow" d="M705 208 H782"/>
  <g transform="translate(782 148)">
    <rect class="box gold" x="0" y="0" width="285" height="120" rx="18"/>
    <text class="h" x="22" y="36">engine detector</text>
    <text class="t" x="22" y="66">结合 layout_hints 和结构</text>
    <text class="mono" x="22" y="92">返回 EngineKVFormat</text>
  </g>

  <path class="arrow" d="M925 268 V345"/>
  <g transform="translate(710 345)">
    <rect class="box" x="0" y="0" width="357" height="130" rx="18"/>
    <text class="h" x="22" y="36">format facts</text>
    <text class="t" x="22" y="66">is_hnd / is_mla / is_cross_layer</text>
    <text class="t" x="22" y="92">pointer order / shape desc</text>
    <text class="mono" x="22" y="114">transfer kernels 只看 format</text>
  </g>

  <g transform="translate(58 345)">
    <rect class="box red" x="0" y="0" width="570" height="130" rx="18"/>
    <text class="h" x="22" y="36">自动探测的边界</text>
    <text class="t" x="22" y="66">rank-4 fused K/V 的 NH/BS 和 BS/NH 仅凭 shape 分不出来</text>
    <text class="t" x="22" y="92">所以 vLLM integration 会传 kv_layout hint</text>
    <text class="mono" x="22" y="114">LBNHC -> NHD，LBHNC -> HND，BL* 保留</text>
  </g>
  <text class="mini" x="58" y="536">结论：能探测容器形态和很多 layout，但“自动”依赖 engine 已解析 layout、显式 hint 或 stride 信息。</text>
</svg>
