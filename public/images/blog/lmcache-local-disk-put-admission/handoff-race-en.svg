```xml
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-labelledby="title desc">
  <title id="title">Resident and In-flight Handoff: Before and After Fix</title>
  <desc id="desc">The upper part shows the old process where the second submission missed the resident and marker handoff, leading to duplicate admission; the lower part shows the safe process after rechecking and registering in the same disk_lock critical section.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#101b33"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8"/>
    </marker>
    <style>
      .title { font: 700 35px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; fill: #f8fafc; }
      .head { font: 700 25px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; fill: #f8fafc; }
      .body { font: 500 18px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; fill: #cbd5e1; }
      .small { font: 500 15px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; fill: #94a3b8; }
      .lane { font: 700 17px "SFMono-Regular",Consolas,monospace; fill: #dbeafe; }
    </style>
  </defs>
  <rect width="1280" height="850" rx="28" fill="url(#bg)"/>
  <text x="640" y="58" text-anchor="middle" class="title">Resident / In-flight Handoff: Before and After Fix</text>

  <rect x="45" y="92" width="1190" height="330" rx="24" fill="#0b1528" stroke="#fb7185" stroke-width="2"/>
  <text x="75" y="134" class="head" fill="#fb7185">Before Fix: There is still a gap between the two atomic operations</text>
  <text x="75" y="192" class="lane">Submit B</text>
  <text x="75" y="317" class="lane">Background A</text>
  <line x1="205" y1="186" x2="1180" y2="186" stroke="#334155" stroke-width="2"/>
  <line x1="205" y1="311" x2="1180" y2="311" stroke="#334155" stroke-width="2"/>

  <rect x="235" y="154" width="180" height="65" rx="13" fill="#172033" stroke="#64748b"/>
  <text x="325" y="181" text-anchor="middle" class="body">Check dict</text>
  <text x="325" y="205" text-anchor="middle" class="small">K not yet resident</text>
  <path d="M415 186H455" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="469" y="154" width="185" height="65" rx="13" fill="#172033" stroke="#64748b"/>
  <text x="561" y="181" text-anchor="middle" class="body">Calculate object size</text>
  <text x="561" y="205" text-anchor="middle" class="small">disk_lock released</text>
  <path d="M654 186H880" stroke="#fb7185" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <rect x="894" y="146" width="226" height="81" rx="13" fill="#2b1518" stroke="#fb7185"/>
  <text x="1007" y="178" text-anchor="middle" class="body">try_insert(K) successful</text>
  <text x="1007" y="204" text-anchor="middle" class="small">No re-check of dict</text>

  <rect x="535" y="279" width="190" height="65" rx="13" fill="#18213a" stroke="#a78bfa"/>
  <text x="630" y="306" text-anchor="middle" class="body">insert_key(K)</text>
  <text x="630" y="330" text-anchor="middle" class="small">dict = {K}</text>
  <path d="M725 311H765" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="779" y="279" width="205" height="65" rx="13" fill="#18213a" stroke="#a78bfa"/>
  <text x="881" y="306" text-anchor="middle" class="body">remove marker</text>
  <text x="881" y="330" text-anchor="middle" class="small">put_tasks = {}</text>
  <path d="M881 277V230" stroke="#fb7185" stroke-width="4" stroke-dasharray="7 7"/>
  <text x="1090" y="382" text-anchor="middle" class="body" fill="#fb7185">Result: Duplicate billing and write again</text>

  <rect x="45" y="453" width="1190" height="330" rx="24" fill="#0b1528" stroke="#2dd4bf" stroke-width="2"/>
  <text x="75" y="495" class="head" fill="#2dd4bf">After Fix: The second resident check and registration share disk_lock</text>
  <text x="75" y="553" class="lane">Submit B</text>
  <text x="75" y="678" class="lane">Background A</text>
  <line x1="205" y1="547" x2="1180" y2="547" stroke="#334155" stroke-width="2"/>
  <line x1="205" y1="672" x2="1180" y2="672" stroke="#334155" stroke-width="2"/>

  <rect x="235" y="515" width="180" height="65" rx="13" fill="#102438" stroke="#38bdf8"/>
  <text x="325" y="542" text-anchor="middle" class="body">First Check</text>
  <text x="325" y="566" text-anchor="middle" class="small">Fast path not hit</text>
  <path d="M415 547H455" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="469" y="515" width="185" height="65" rx="13" fill="#102438" stroke="#38bdf8"/>
  <text x="561" y="542" text-anchor="middle" class="body">Calculate object size</text>
  <text x="561" y="566" text-anchor="middle" class="small">Allow A to complete handoff</text>
  <path d="M654 547H880" stroke="#2dd4bf" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="894" y="507" width="250" height="81" rx="13" fill="#102b35" stroke="#2dd4bf"/>
  <text x="1019" y="539" text-anchor="middle" class="body">Re-check within disk_lock</text>
  <text x="1019" y="565" text-anchor="middle" class="small">See resident, return directly</text>

  <rect x="535" y="640" width="190" height="65" rx="13" fill="#102438" stroke="#38bdf8"/>
  <text x="630" y="667" text-anchor="middle" class="body">insert_key(K)</text>
  <text x="630" y="691" text-anchor="middle" class="small">dict = {K}</text>
  <path d="M725 672H765" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="779" y="640" width="205" height="65" rx="13" fill="#102438" stroke="#38bdf8"/>
  <text x="881" y="667" text-anchor="middle" class="body">remove marker</text>
  <text x="881" y="691" text-anchor="middle" class="small">put_tasks = {}</text>
  <path d="M881 638V591" stroke="#2dd4bf" stroke-width="4" stroke-dasharray="7 7"/>
  <text x="1088" y="744" text-anchor="middle" class="body" fill="#2dd4bf">Result: Not registered, not billed, not scheduled</text>
</svg>
```