<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc">
  <title id="title">LMCache ZMQ to gRPC migration roadmap</title>
  <desc id="desc">A staged roadmap showing LMCache moving from ZMQ-only positional payloads to typed messages, protobuf schemas, runtime gRPC, and eventually gRPC-first operation.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0 L11,4.5 L0,9 Z" fill="#334155" />
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .stage { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
      .done { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.8; }
      .now { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.8; }
      .next { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.8; }
      .title { fill: #0f172a; font: 700 26px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .heading { fill: #0f172a; font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .text { fill: #334155; font: 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .code { fill: #0f172a; font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .muted { fill: #64748b; font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .arrow { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1280" height="700" rx="20" />
  <text class="title" x="50" y="58">为什么后续会逐渐放弃 ZMQ：迁移不是一次替换，而是四步收敛</text>
  <text class="muted" x="50" y="88">ZMQ 会保留一段兼容期，但新增能力会越来越倾向于 explicit schema + typed RPC。</text>

  <rect class="stage" x="56" y="160" width="250" height="250" rx="18" />
  <text class="heading" x="84" y="202">0. 旧世界</text>
  <text class="code" x="84" y="238">RequestType + [payload...]</text>
  <text class="text" x="84" y="276">调用方知道 ZMQ 细节</text>
  <text class="text" x="84" y="306">参数顺序就是契约</text>
  <text class="text" x="84" y="336">扩展容易牵动全局</text>

  <rect class="done" x="356" y="160" width="250" height="250" rx="18" />
  <text class="heading" x="384" y="202">1. typed Python RPC</text>
  <text class="code" x="384" y="238">RequestClient.lookup()</text>
  <text class="text" x="384" y="276">调用方只看命名方法</text>
  <text class="text" x="384" y="306">ProtocolDefinition 给语义类型</text>
  <text class="text" x="384" y="336">ZMQ 退到边界后面</text>

  <rect class="done" x="656" y="160" width="250" height="250" rx="18" />
  <text class="heading" x="684" y="202">2. protobuf schema</text>
  <text class="code" x="684" y="238">*_service.proto</text>
  <text class="text" x="684" y="276">wire 字段显式可读</text>
  <text class="text" x="684" y="306">生成 binding 与 stub</text>
  <text class="text" x="684" y="336">codec 对齐 Python 类型</text>

  <rect class="now" x="956" y="160" width="250" height="250" rx="18" />
  <text class="heading" x="984" y="202">3. 运行态 gRPC</text>
  <text class="code" x="984" y="238">--transport grpc</text>
  <text class="text" x="984" y="276">URL scheme 选择 client</text>
  <text class="text" x="984" y="306">server 注册生成服务</text>
  <text class="text" x="984" y="336">CI 开始覆盖 grpc matrix</text>

  <path class="arrow" d="M306 285 H356" />
  <path class="arrow" d="M606 285 H656" />
  <path class="arrow" d="M906 285 H956" />

  <rect class="next" x="188" y="498" width="904" height="92" rx="16" />
  <text class="heading" x="220" y="536">下一步：gRPC-first，而不是立刻删除 ZMQ</text>
  <text class="text" x="220" y="568">推荐新部署启用 gRPC；老部署继续可用。等文档、CI、插件和外部集成稳定后，再逐步降低 ZMQ 的默认权重。</text>
</svg>
