<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">LMCache request transport boundary</title>
  <desc id="desc">The request transport boundary separates application code from ZMQ and gRPC implementations while KV data transfer remains a separate path.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0 L11,4.5 L0,9 Z" fill="#334155" />
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .lane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .app { fill: #eef2ff; stroke: #4f46e5; stroke-width: 1.6; }
      .neutral { fill: #ecfeff; stroke: #0891b2; stroke-width: 1.8; }
      .zmq { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.6; }
      .grpc { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.6; }
      .data { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.6; }
      .title { fill: #0f172a; font: 700 26px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .heading { fill: #0f172a; font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .text { fill: #334155; font: 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .code { fill: #0f172a; font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .muted { fill: #64748b; font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .arrow { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1280" height="720" rx="20" />
  <text class="title" x="52" y="58">这次重构的核心：应用层不再认识 ZMQ payload list</text>
  <text class="muted" x="52" y="88">所有调用方都依赖命名 RequestClient；选择 ZMQ 还是 gRPC 发生在 URL scheme 和 server config 上。</text>

  <rect class="lane" x="54" y="128" width="1172" height="164" rx="18" />
  <text class="heading" x="82" y="164">应用层调用方</text>
  <rect class="app" x="82" y="190" width="250" height="58" rx="10" />
  <text class="code" x="104" y="225">vLLM / SGLang / SDK</text>
  <rect class="app" x="382" y="190" width="250" height="58" rx="10" />
  <text class="code" x="404" y="225">client.lookup(...)</text>
  <rect class="app" x="682" y="190" width="250" height="58" rx="10" />
  <text class="code" x="704" y="225">client.store(...)</text>
  <rect class="app" x="982" y="190" width="190" height="58" rx="10" />
  <text class="code" x="1004" y="225">client.ping(...)</text>

  <path class="arrow" d="M640 292 V348" />
  <rect class="neutral" x="366" y="348" width="548" height="106" rx="16" />
  <text class="heading" x="394" y="386">RequestClientFactory + RequestClient</text>
  <text class="text" x="394" y="416">裸 host:port / tcp:// / ipc:// / inproc:// 走 ZMQ；grpc:// / grpc+unix:// 走 gRPC。</text>
  <text class="code" x="394" y="444">create("grpc://localhost:5555") -> GrpcMultiprocessClient</text>

  <path class="arrow" d="M500 454 V514" />
  <path class="arrow" d="M780 454 V514" />
  <rect class="zmq" x="196" y="514" width="360" height="104" rx="16" />
  <text class="heading" x="224" y="552">ZMQ facade</text>
  <text class="text" x="224" y="582">兼容旧 wire：RequestType + positional payload list</text>
  <text class="code" x="224" y="610">MessageQueueClient</text>
  <rect class="grpc" x="724" y="514" width="360" height="104" rx="16" />
  <text class="heading" x="752" y="552">gRPC client/server</text>
  <text class="text" x="752" y="582">protobuf request / response + method codec registry</text>
  <text class="code" x="752" y="610">*_service_pb2_grpc</text>

  <rect class="data" x="356" y="646" width="568" height="46" rx="12" />
  <text class="heading" x="386" y="676">KV bytes 搬运不在这层：CUDA IPC / SHM / engine-driven transfer 仍由 transfer context 决定</text>
  <path class="dash" d="M640 618 V646" />
</svg>
