<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">没有和有 has_pending_push_work 时的 idle 边界</title>
  <desc id="desc">没有保活钩子时最后一个请求结束后 Engine 停止 step，worker 完成报告无法回到 scheduler；有保活钩子时通过零 token step 完成回报和 block 释放。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111c35"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".25"/>
    </filter>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#fb7185"/>
    </marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
    <style>
      .sans{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}
      .title{font-size:36px;font-weight:760;fill:#f8fafc}
      .subtitle{font-size:18px;fill:#94a3b8}
      .colTitle{font-size:27px;font-weight:730;fill:#f8fafc}
      .step{font-size:18px;font-weight:680;fill:#f8fafc}
      .body{font-size:17px;fill:#cbd5e1}
      .small{font-size:15px;fill:#94a3b8}
      .code{font-family:"SFMono-Regular",Consolas,monospace;font-size:15px;fill:#bfdbfe}
    </style>
  </defs>
  <rect width="1400" height="980" rx="28" fill="url(#bg)"/>
  <g class="sans">
    <text x="70" y="70" class="title">最后一个请求结束：消息泵会不会继续转？</text>
    <text x="70" y="106" class="subtitle">同一个 worker store，差别只在 Scheduler 是否愿意继续执行零 token Step</text>

    <g filter="url(#shadow)">
      <rect x="55" y="145" width="625" height="765" rx="26" fill="#2b1822" stroke="#fb7185" stroke-width="2.5"/>
      <text x="90" y="195" class="colTitle">没有 PR #4998</text>
      <text x="90" y="226" class="small">默认 has_pending_push_work() = False</text>

      <line x1="132" y1="285" x2="132" y2="790" stroke="#64748b" stroke-width="3"/>
      <circle cx="132" cy="285" r="11" fill="#60a5fa"/>
      <text x="172" y="281" class="step">① A 的 lazy store 已提交</text>
      <text x="172" y="310" class="body">Scheduler touch blocks；Worker 异步写缓存</text>

      <circle cx="132" cy="395" r="11" fill="#60a5fa"/>
      <text x="172" y="391" class="step">② 最后一个请求 B 结束</text>
      <text x="172" y="420" class="body">waiting = 0，running = 0</text>

      <circle cx="132" cy="505" r="11" fill="#fb7185"/>
      <text x="172" y="501" class="step">③ Scheduler 判断“没有工作”</text>
      <text x="172" y="530" class="code">has_requests() == False</text>

      <circle cx="132" cy="615" r="11" fill="#f59e0b"/>
      <text x="172" y="611" class="step">④ Worker 完成 store</text>
      <text x="172" y="640" class="body">完成信息停在 completed_store_requests</text>

      <circle cx="132" cy="725" r="11" fill="#fb7185"/>
      <text x="172" y="721" class="step">⑤ 没有下一轮 ModelRunnerOutput</text>
      <text x="172" y="750" class="body">update_connector_output() 不会被调用</text>

      <path d="M132 755 L132 795" stroke="#fb7185" stroke-width="4" marker-end="url(#redArrow)"/>
      <rect x="90" y="808" width="555" height="67" rx="16" fill="#4c1d2b"/>
      <text x="367" y="837" text-anchor="middle" class="step">blocks 仍不可复用</text>
      <text x="367" y="861" text-anchor="middle" class="small">直到新请求再次启动 Engine Step</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="720" y="145" width="625" height="765" rx="26" fill="#102a27" stroke="#34d399" stroke-width="2.5"/>
      <text x="755" y="195" class="colTitle">有 PR #4998</text>
      <text x="755" y="226" class="small">in-flight block IDs 让 connector 主动保活</text>

      <line x1="797" y1="285" x2="797" y2="790" stroke="#64748b" stroke-width="3"/>
      <circle cx="797" cy="285" r="11" fill="#60a5fa"/>
      <text x="837" y="281" class="step">① A 的 lazy store 已提交</text>
      <text x="837" y="310" class="body">_request_block_ids 中仍有 A</text>

      <circle cx="797" cy="395" r="11" fill="#60a5fa"/>
      <text x="837" y="391" class="step">② 最后一个请求 B 结束</text>
      <text x="837" y="420" class="body">正常请求已清空，但 connector 尚未清空</text>

      <circle cx="797" cy="505" r="11" fill="#34d399"/>
      <text x="837" y="501" class="step">③ Scheduler 继续 step</text>
      <text x="837" y="530" class="code">has_pending_push_work() == True</text>

      <circle cx="797" cy="615" r="11" fill="#34d399"/>
      <text x="837" y="611" class="step">④ 执行零 token Step</text>
      <text x="837" y="640" class="body">不跑模型 forward，但收集 worker metadata</text>

      <circle cx="797" cy="725" r="11" fill="#34d399"/>
      <text x="837" y="721" class="step">⑤ Scheduler 收到 completion</text>
      <text x="837" y="750" class="body">update_connector_output() → free_blocks()</text>

      <path d="M797 755 L797 795" stroke="#34d399" stroke-width="4" marker-end="url(#greenArrow)"/>
      <rect x="755" y="808" width="555" height="67" rx="16" fill="#064e3b"/>
      <text x="1032" y="837" text-anchor="middle" class="step">blocks 在 idle 前恢复可复用</text>
      <text x="1032" y="861" text-anchor="middle" class="small">下一批请求可以看到干净的 BlockPool</text>
    </g>

    <text x="700" y="947" text-anchor="middle" class="body">has_pending_push_work() 不是让 store 更快，而是保证最后一张“完成回执”能送回 Scheduler</text>
  </g>
</svg>
