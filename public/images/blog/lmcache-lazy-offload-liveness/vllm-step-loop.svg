<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">vLLM Step 调度循环与 connector 消息泵</title>
  <desc id="desc">Scheduler has_requests 由未完成请求、普通延迟释放和 connector in-flight 工作共同决定。进入 Step 后生成 SchedulerOutput；正 token 路径执行模型，零 token 路径只推进 connector，二者最终都通过 ModelRunnerOutput 回到 Scheduler 更新状态。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111c35"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/>
    </marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
    <style>
      .sans{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}
      .title{font-size:36px;font-weight:760;fill:#f8fafc}
      .subtitle{font-size:18px;fill:#94a3b8}
      .nodeTitle{font-size:22px;font-weight:730;fill:#f8fafc}
      .body{font-size:17px;fill:#cbd5e1}
      .small{font-size:15px;fill:#94a3b8}
      .label{font-size:15px;font-weight:700;fill:#dbeafe}
      .code{font-family:"SFMono-Regular",Consolas,monospace;font-size:15px;fill:#bfdbfe}
    </style>
  </defs>
  <rect width="1400" height="980" rx="28" fill="url(#bg)"/>
  <g class="sans">
    <text x="70" y="68" class="title">vLLM Step：模型执行循环，也是 connector 消息泵</text>
    <text x="70" y="103" class="subtitle">没有进入 Step，就既没有下一次 forward，也没有下一份 worker completion 可以回到 Scheduler</text>

    <g filter="url(#shadow)">
      <rect x="70" y="150" width="300" height="82" rx="20" fill="#132a32" stroke="#14b8a6" stroke-width="2"/>
      <text x="220" y="184" text-anchor="middle" class="nodeTitle">unfinished requests</text>
      <text x="220" y="211" text-anchor="middle" class="small">waiting / running</text>
      <rect x="395" y="150" width="300" height="82" rx="20" fill="#302517" stroke="#f59e0b" stroke-width="2"/>
      <text x="545" y="184" text-anchor="middle" class="nodeTitle">finished requests</text>
      <text x="545" y="211" text-anchor="middle" class="small">普通 delayed-free</text>
      <rect x="720" y="150" width="400" height="82" rx="20" fill="#2b1d42" stroke="#a78bfa" stroke-width="2"/>
      <text x="920" y="184" text-anchor="middle" class="nodeTitle">connector in-flight work</text>
      <text x="920" y="211" text-anchor="middle" class="small">PR #4998：已提交 lazy store</text>
    </g>

    <path d="M220 232 L220 267 L515 267" fill="none" stroke="#64748b" stroke-width="3"/>
    <path d="M545 232 L545 267" fill="none" stroke="#64748b" stroke-width="3"/>
    <path d="M920 232 L920 267 L575 267" fill="none" stroke="#64748b" stroke-width="3"/>
    <path d="M545 267 L545 296" fill="none" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="360" y="300" width="370" height="94" rx="47" fill="url(#blue)"/>
      <text x="545" y="340" text-anchor="middle" class="nodeTitle">Scheduler.has_requests()</text>
      <text x="545" y="368" text-anchor="middle" class="label">三类状态任一为 True → 进入 Step</text>
    </g>
    <path d="M730 347 L1245 347" stroke="#fb7185" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="980" y="331" text-anchor="middle" class="small">全部为 False</text>
    <rect x="1250" y="306" width="105" height="82" rx="20" fill="#3b1823" stroke="#fb7185" stroke-width="2"/>
    <text x="1302" y="340" text-anchor="middle" class="nodeTitle">IDLE</text>
    <text x="1302" y="366" text-anchor="middle" class="small">停止 Step</text>

    <path d="M545 394 L545 440" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)"/>
    <g filter="url(#shadow)">
      <rect x="355" y="444" width="380" height="104" rx="24" fill="#172554" stroke="#3b82f6" stroke-width="2.5"/>
      <text x="545" y="483" text-anchor="middle" class="nodeTitle">① Scheduler.schedule()</text>
      <text x="545" y="514" text-anchor="middle" class="body">选请求、分配 blocks、生成 SchedulerOutput</text>
    </g>

    <path d="M545 548 L545 585" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)"/>
    <polygon points="545,590 700,660 545,730 390,660" fill="#1e293b" stroke="#60a5fa" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="545" y="650" text-anchor="middle" class="nodeTitle">scheduled tokens</text>
    <text x="545" y="678" text-anchor="middle" class="code">&gt; 0 ?</text>

    <path d="M390 660 L220 660 L220 735" fill="none" stroke="#34d399" stroke-width="4" marker-end="url(#greenArrow)"/>
    <text x="300" y="642" text-anchor="middle" class="label" fill="#d1fae5">YES</text>
    <g filter="url(#shadow)">
      <rect x="70" y="740" width="300" height="105" rx="24" fill="#102a27" stroke="#34d399" stroke-width="2.5"/>
      <text x="220" y="780" text-anchor="middle" class="nodeTitle">②A 模型执行</text>
      <text x="220" y="811" text-anchor="middle" class="body">forward + connector</text>
    </g>

    <path d="M700 660 L870 660 L870 735" fill="none" stroke="#a78bfa" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="785" y="642" text-anchor="middle" class="label">NO：零 token</text>
    <g filter="url(#shadow)">
      <rect x="720" y="740" width="300" height="105" rx="24" fill="#2b1d42" stroke="#a78bfa" stroke-width="2.5"/>
      <text x="870" y="780" text-anchor="middle" class="nodeTitle">②B connector-only</text>
      <text x="870" y="811" text-anchor="middle" class="body">不 forward，只收 completion</text>
    </g>

    <path d="M370 792 L500 792" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M720 792 L670 792" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)"/>
    <g filter="url(#shadow)">
      <rect x="505" y="745" width="160" height="94" rx="22" fill="url(#violet)"/>
      <text x="585" y="783" text-anchor="middle" class="nodeTitle">Output</text>
      <text x="585" y="811" text-anchor="middle" class="small" fill="#ede9fe">worker metadata</text>
    </g>

    <path d="M585 839 L585 885 L1180 885 L1180 722" fill="none" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)"/>
    <g filter="url(#shadow)">
      <rect x="1030" y="555" width="300" height="165" rx="24" fill="#132a32" stroke="#14b8a6" stroke-width="2.5"/>
      <text x="1180" y="596" text-anchor="middle" class="nodeTitle">③ update_from_output()</text>
      <text x="1180" y="630" text-anchor="middle" class="body">更新请求状态</text>
      <text x="1180" y="660" text-anchor="middle" class="body">消费 connector completion</text>
      <text x="1180" y="690" text-anchor="middle" class="body">必要时 free_blocks()</text>
    </g>
    <path d="M1180 555 L1180 430 L760 430 L760 347 L732 347" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#greenArrow)"/>
    <text x="970" y="414" text-anchor="middle" class="small">状态改变后，下一轮重新判断</text>

    <rect x="70" y="900" width="1260" height="48" rx="16" fill="#111827" stroke="#475569" stroke-width="1.5"/>
    <text x="700" y="931" text-anchor="middle" class="body">PR #4998 的作用点：即使正常请求清空，只要 in-flight store 仍可通过 Step 收到 completion，就不让消息泵提前停止</text>
  </g>
</svg>
