<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">LMCache MP lazy offload 的角色与所有权</title>
  <desc id="desc">vLLM Scheduler 拥有 BlockPool 与最终释放权，Model Worker 执行异步存储并上报完成，LMCache Server 接收 KV 数据。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111c35"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/>
    </marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
    <style>
      .sans{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}
      .title{font-size:36px;font-weight:760;fill:#f8fafc}
      .subtitle{font-size:18px;fill:#94a3b8}
      .boxTitle{font-size:25px;font-weight:720;fill:#f8fafc}
      .body{font-size:18px;fill:#cbd5e1}
      .small{font-size:16px;fill:#94a3b8}
      .label{font-size:16px;font-weight:700}
      .code{font-family:"SFMono-Regular",Consolas,monospace;font-size:16px;fill:#bfdbfe}
    </style>
  </defs>
  <rect width="1400" height="900" rx="28" fill="url(#bg)"/>
  <g class="sans">
    <text x="70" y="70" class="title">Lazy offload 不在“一个对象”里完成</text>
    <text x="70" y="106" class="subtitle">都属于 vLLM 进程体系，但 Scheduler 与 Model Worker 是不同角色、不同 connector 实例</text>

    <g filter="url(#shadow)">
      <rect x="65" y="170" width="430" height="515" rx="26" fill="#132a32" stroke="#14b8a6" stroke-width="2.5"/>
      <rect x="96" y="201" width="156" height="34" rx="17" fill="#0f766e"/>
      <text x="174" y="224" text-anchor="middle" class="label" fill="#ccfbf1">SCHEDULER ROLE</text>
      <text x="100" y="280" class="boxTitle">EngineCore / Scheduler</text>
      <text x="100" y="320" class="body">唯一权威：</text>
      <text x="122" y="358" class="body">• BlockPool 分配状态</text>
      <text x="122" y="393" class="body">• block 引用与可复用性</text>
      <text x="122" y="428" class="body">• request 调度生命周期</text>
      <text x="100" y="482" class="body">LMCacheMPConnector 持有：</text>
      <text x="122" y="520" class="code">_gpu_block_pool</text>
      <text x="122" y="555" class="code">_pending_store</text>
      <text x="122" y="590" class="code">_request_block_ids</text>
      <rect x="98" y="620" width="364" height="42" rx="12" fill="#064e3b"/>
      <text x="280" y="647" text-anchor="middle" class="label" fill="#d1fae5">最终调用 free_blocks()</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="535" y="170" width="390" height="515" rx="26" fill="#172554" stroke="#3b82f6" stroke-width="2.5"/>
      <rect x="566" y="201" width="138" height="34" rx="17" fill="#1d4ed8"/>
      <text x="635" y="224" text-anchor="middle" class="label" fill="#dbeafe">WORKER ROLE</text>
      <text x="570" y="280" class="boxTitle">Model Worker</text>
      <text x="570" y="320" class="body">负责数据面：</text>
      <text x="592" y="358" class="body">• 接收 STORE metadata</text>
      <text x="592" y="393" class="body">• 发起异步 KV store</text>
      <text x="592" y="428" class="body">• 查询 store future</text>
      <text x="592" y="463" class="body">• 汇总每个 worker 的完成数</text>
      <text x="570" y="517" class="body">LMCacheMPConnector 持有：</text>
      <text x="592" y="555" class="code">worker_adapter</text>
      <text x="592" y="590" class="code">completed_store_requests</text>
      <rect x="567" y="620" width="326" height="42" rx="12" fill="#1e3a8a"/>
      <text x="730" y="647" text-anchor="middle" class="label" fill="#dbeafe">只报告完成，不释放 BlockPool</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="965" y="170" width="370" height="515" rx="26" fill="#302517" stroke="#f59e0b" stroke-width="2.5"/>
      <rect x="996" y="201" width="148" height="34" rx="17" fill="#b45309"/>
      <text x="1070" y="224" text-anchor="middle" class="label" fill="#fef3c7">CACHE SERVICE</text>
      <text x="1000" y="280" class="boxTitle">LMCache Server</text>
      <text x="1000" y="320" class="body">负责缓存服务：</text>
      <text x="1022" y="358" class="body">• 接收 KV 数据</text>
      <text x="1022" y="393" class="body">• 写入内存 / 磁盘 / 后端</text>
      <text x="1022" y="428" class="body">• 完成 store RPC</text>
      <text x="1000" y="487" class="body">它不拥有 vLLM 的：</text>
      <text x="1022" y="525" class="body">• GPU BlockPool</text>
      <text x="1022" y="560" class="body">• Scheduler request 状态</text>
      <text x="1022" y="595" class="body">• block 可复用判定</text>
      <rect x="997" y="620" width="306" height="42" rx="12" fill="#78350f"/>
      <text x="1150" y="647" text-anchor="middle" class="label" fill="#fef3c7">无法直接 free vLLM block</text>
    </g>

    <path d="M495 345 C515 345 515 345 533 345" stroke="#60a5fa" stroke-width="4" marker-end="url(#blueArrow)"/>
    <text x="514" y="328" text-anchor="middle" class="small">STORE metadata</text>
    <path d="M925 390 C945 390 945 390 963 390" stroke="#34d399" stroke-width="4" marker-end="url(#greenArrow)"/>
    <text x="944" y="373" text-anchor="middle" class="small">KV data</text>
    <path d="M535 520 C515 520 515 520 497 520" stroke="#60a5fa" stroke-width="4" marker-end="url(#blueArrow)"/>
    <text x="515" y="505" text-anchor="middle" class="small">worker metadata</text>

    <rect x="110" y="748" width="1180" height="92" rx="24" fill="#111827" stroke="#475569" stroke-width="2"/>
    <text x="700" y="785" text-anchor="middle" class="body">完成 store ≠ Scheduler 已知完成</text>
    <text x="700" y="817" text-anchor="middle" class="small">必须再经过一次 Engine Step，把 worker completion 带回 Scheduler，才能触发 free_blocks()</text>
  </g>
</svg>
