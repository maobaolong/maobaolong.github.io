<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="870" viewBox="0 0 1400 870" role="img" aria-labelledby="title desc">
  <title id="title">Lazy offload 的 queued 与 in-flight 状态机</title>
  <desc id="desc">Store metadata 先进入 FIFO queued 状态，达到策略条件且有正 token step 时进入 in-flight，worker completion 返回 scheduler 后释放 block。queued-only 在零 token step 中无法推进，是 PR 4998 的未闭环边界。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111c35"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/>
    </marker>
    <marker id="warnArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <style>
      .sans{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}
      .title{font-size:36px;font-weight:760;fill:#f8fafc}
      .subtitle{font-size:18px;fill:#94a3b8}
      .boxTitle{font-size:25px;font-weight:720;fill:#f8fafc}
      .body{font-size:18px;fill:#cbd5e1}
      .small{font-size:16px;fill:#94a3b8}
      .code{font-family:"SFMono-Regular",Consolas,monospace;font-size:15px;fill:#bfdbfe}
      .warn{font-size:17px;font-weight:680;fill:#fef3c7}
    </style>
  </defs>
  <rect width="1400" height="870" rx="28" fill="url(#bg)"/>
  <g class="sans">
    <text x="70" y="70" class="title">不要把两种 pending 混成一件事</text>
    <text x="70" y="106" class="subtitle">queued 表示“还没发”；in-flight 表示“已经发了，只差 completion 与释放”</text>

    <g filter="url(#shadow)">
      <rect x="70" y="210" width="330" height="255" rx="26" fill="#172554" stroke="#3b82f6" stroke-width="2.5"/>
      <text x="105" y="258" class="boxTitle">QUEUED</text>
      <text x="105" y="293" class="body">Store metadata 在 FIFO</text>
      <text x="105" y="332" class="code">_policy._pending_items</text>
      <text x="105" y="378" class="body">尚未提交给 worker</text>
      <text x="105" y="413" class="body">GPU block 未因本次 store</text>
      <text x="105" y="441" class="body">进入 in-flight pin 状态</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="535" y="210" width="330" height="255" rx="26" fill="#2b1d42" stroke="#a78bfa" stroke-width="2.5"/>
      <text x="570" y="258" class="boxTitle">IN-FLIGHT</text>
      <text x="570" y="293" class="body">Store 已提交给 worker</text>
      <text x="570" y="332" class="code">_request_block_ids</text>
      <text x="570" y="378" class="body">Scheduler 已 touch blocks</text>
      <text x="570" y="413" class="body">等待所有 worker 报告完成</text>
      <text x="570" y="441" class="body">此时必须维持 Engine Step</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="1000" y="210" width="330" height="255" rx="26" fill="#132a32" stroke="#14b8a6" stroke-width="2.5"/>
      <text x="1035" y="258" class="boxTitle">FREED</text>
      <text x="1035" y="293" class="body">Scheduler 收到 completion</text>
      <text x="1035" y="332" class="code">update_connector_output()</text>
      <text x="1035" y="378" class="body">free_blocks()</text>
      <text x="1035" y="413" class="body">删除 block ID 记录</text>
      <text x="1035" y="441" class="body">BlockPool 可再次分配</text>
    </g>

    <path d="M400 320 C450 320 485 320 533 320" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="467" y="275" text-anchor="middle" class="small">达到 threshold</text>
    <text x="467" y="299" text-anchor="middle" class="small">且有正 token Step</text>
    <path d="M865 320 C915 320 950 320 998 320" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="932" y="276" text-anchor="middle" class="small">worker completion</text>
    <text x="932" y="300" text-anchor="middle" class="small">随 Step 返回</text>

    <rect x="70" y="555" width="1260" height="230" rx="26" fill="#302517" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="10 7"/>
    <text x="105" y="603" class="boxTitle">PR #4998 的关键边界：queued-only 不能靠空 Step 进入 in-flight</text>
    <text x="105" y="647" class="body">当前实现把 queued 和 in-flight 都视为 has_pending_push_work()，但 LMCache 只有在</text>
    <text x="105" y="682" class="code">scheduler_output.total_num_scheduled_tokens &gt; 0</text>
    <text x="565" y="682" class="body">时才从 FIFO 提交 store。</text>
    <text x="105" y="727" class="warn">因此：queued → 保活 → 零 token Step → 仍不能提交 → queued，可能形成持续空转。</text>
    <text x="105" y="763" class="body">最小安全方案：只让 in-flight 保活；完整方案：为 queued 提供真正可执行的 connector-only 提交通路。</text>

    <path d="M235 465 C235 505 235 518 235 553" stroke="#f59e0b" stroke-width="4" stroke-dasharray="7 6" marker-end="url(#warnArrow)"/>
  </g>
</svg>
