<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="650" viewBox="0 0 1180 650" role="img" aria-labelledby="title desc">
  <title id="title">Kernel 路径与 direct-copy 路径</title><desc id="desc">左侧经过 pinned host、GPU staging buffer 和 block-transfer kernel；右侧通过 cudaMemcpyBatchAsync 直接从 pinned host 到 engine paged blocks。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#121721"/><stop offset=".5" stop-color="#202a36"/><stop offset="1" stop-color="#0e141b"/></linearGradient><marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M2 2L10 6L2 10Z" fill="#91a4b6"/></marker><style>.title{fill:#f8fafc;font:800 31px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.sub{fill:#a9b8c6;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.lane{fill:#161f29;stroke:#506273;stroke-width:1.4}.fast{fill:#142a27;stroke:#79d8bd;stroke-width:1.8}.box{fill:#23313f;stroke:#718599;stroke-width:1.3}.hot{fill:#29453e;stroke:#9de6d2;stroke-width:1.7}.head{fill:#f1f5f9;font:800 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.body{fill:#d5dee7;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.micro{fill:#9fb0bf;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{fill:#9de6d2;font:700 14px ui-monospace,SFMono-Regular,Menlo,monospace}.edge{fill:none;stroke:#91a4b6;stroke-width:3;marker-end:url(#a)}.fastEdge{fill:none;stroke:#9de6d2;stroke-width:4;marker-end:url(#a)}.bad{fill:#eaa36f}.good{fill:#9de6d2}</style></defs>
  <rect width="1180" height="650" rx="28" fill="url(#bg)"/><text class="title" x="54" y="58">同样的 KV bytes，两条不同的搬运路线</text><text class="sub" x="56" y="88">Direct copy 删掉的不是数据，而是中间 staging 和一次 SM kernel。</text>
  <g transform="translate(58 130)"><rect class="lane" width="510" height="432" rx="22"/><text class="head" x="26" y="43">通用 kernel 路径</text><text class="micro" x="26" y="69">兼容所有 EngineKVFormat</text><g transform="translate(105 96)"><rect class="box" width="300" height="64" rx="14"/><text class="body" x="150" y="28" text-anchor="middle">Pinned host object</text><text class="micro" x="150" y="49" text-anchor="middle">连续 LMCache chunk</text></g><path class="edge" d="M255 160L255 210"/><text class="mono" x="275" y="192">cudaMemcpyAsync</text><g transform="translate(105 210)"><rect class="box" width="300" height="64" rx="14"/><text class="body" x="150" y="28" text-anchor="middle">GPU staging buffer</text><text class="micro" x="150" y="49" text-anchor="middle">额外临时落点</text></g><path class="edge" d="M255 274L255 324"/><text class="mono" x="275" y="307">CUDA block kernel</text><g transform="translate(105 324)"><rect class="box" width="300" height="64" rx="14"/><text class="body" x="150" y="28" text-anchor="middle">Engine paged KV blocks</text><text class="micro" x="150" y="49" text-anchor="middle">按 block IDs gather / scatter</text></g><circle class="bad" cx="64" cy="235" r="7"><animate attributeName="cy" values="140;235;362" dur="2.8s" repeatCount="indefinite"/></circle></g>
  <g transform="translate(612 130)"><rect class="fast" width="510" height="432" rx="22"/><text class="head" x="26" y="43">Direct-copy 快速路径</text><text class="micro" x="26" y="69">只接受 block 连续的 token-major layout</text><g transform="translate(105 96)"><rect class="hot" width="300" height="64" rx="14"/><text class="body" x="150" y="28" text-anchor="middle">Pinned host object</text><text class="micro" x="150" y="49" text-anchor="middle">连续 LMCache chunk</text></g><path class="fastEdge" d="M255 160L255 324"/><text class="mono" x="276" y="242">cudaMemcpyBatchAsync</text><text class="micro" x="276" y="266">多段 DMA · copy engine</text><g transform="translate(105 324)"><rect class="hot" width="300" height="64" rx="14"/><text class="body" x="150" y="28" text-anchor="middle">Engine paged KV blocks</text><text class="micro" x="150" y="49" text-anchor="middle">CPU 已解析每个 block 地址</text></g><circle class="good" cx="64" cy="235" r="7"><animate attributeName="cy" values="140;362" dur="1.8s" repeatCount="indefinite"/></circle></g>
  <g transform="translate(297 590)"><text class="body" x="0" y="0"><tspan class="bad">旧路：</tspan> staging + SM kernel</text><text class="body" x="350" y="0"><tspan class="good">新路：</tspan> batch DMA + copy engine</text></g>
</svg>
