<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="650" viewBox="0 0 1180 650" role="img" aria-labelledby="title desc">
  <title id="title">One case unlocks direct copy</title><desc id="desc">After the EngineKVFormat case is added, resolve_block_addressing makes the eligibility check return true and supplies the base and stride recipe to the executor.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101720"/><stop offset=".5" stop-color="#1c2f34"/><stop offset="1" stop-color="#0d131a"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M2 2L10 6L2 10Z" fill="#8da3b5"/></marker><style>.title{fill:#f8fafc;font:800 31px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.sub{fill:#a9b8c6;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.panel{fill:#17222c;stroke:#536879;stroke-width:1.4}.core{fill:#18322e;stroke:#89e0c7;stroke-width:2}.out{fill:#172a3a;stroke:#8dbce5;stroke-width:1.6}.head{fill:#f1f5f9;font:800 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.body{fill:#d5dee7;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.micro{fill:#9fb0bf;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{fill:#bff4e5;font:700 14px ui-monospace,SFMono-Regular,Menlo,monospace}.code{fill:#0c161e;stroke:#486071}.edge{fill:none;stroke:#8da3b5;stroke-width:2.7;marker-end:url(#a)}.lit{fill:#9de6d2;filter:url(#glow)}.yes{fill:#86efac;font:800 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.badge{fill:#0e1821;stroke:#405767}</style></defs>
  <rect width="1180" height="650" rx="28" fill="url(#bg)"/><text class="title" x="54" y="58">How one line opens the gate and provides the map</text><text class="sub" x="56" y="88">resolve_block_addressing() is both the format eligibility table and the executor's address recipe.</text>
  <g transform="translate(52 150)"><rect class="panel" width="292" height="336" rx="20"/><text class="head" x="22" y="42">Input: SGLang format 18</text><rect class="code" x="22" y="76" width="248" height="100" rx="13"/><text class="mono" x="38" y="105">NL_X_NB_BS_NH_HS</text><text class="body" x="38" y="136">each entry:</text><text class="mono" x="38" y="160">[NB, BS, NH, HS]</text><text class="body" x="22" y="222">token-major</text><text class="body" x="22" y="249">block-contiguous</text><text class="micro" x="22" y="291">one block = one continuous range</text></g>
  <path class="edge" d="M344 318 C382 318 398 318 436 318"/>
  <g transform="translate(436 130)"><rect class="core" width="316" height="376" rx="22"/><text class="head" x="24" y="42">resolve_block_addressing()</text><rect class="code" x="24" y="78" width="268" height="124" rx="14"/><text class="mono" x="40" y="108">case ...NB_BS_NH_HS:</text><text class="mono" x="40" y="139">  out = {kPerLayer,</text><text class="mono" x="40" y="164">         0, 0, blk, tight};</text><text class="mono" x="40" y="189">  return true;</text><g transform="translate(24 236)"><rect class="badge" width="268" height="88" rx="13"/><text class="body" x="18" y="30">Address formula</text><text class="mono" x="18" y="56">base[entry] + block_id × blk</text><text class="micro" x="18" y="77">bytes = BS × NH × HS × elem</text></g><circle class="lit" cx="158" cy="350" r="8"><animate attributeName="opacity" values=".25;1;.25" dur="1.6s" repeatCount="indefinite"/></circle></g>
  <path class="edge" d="M752 250 C792 230 808 220 844 220"/><path class="edge" d="M752 386 C792 406 808 416 844 416"/>
  <g transform="translate(844 138)"><rect class="out" width="284" height="164" rx="20"/><text class="head" x="22" y="42">① Eligibility gate</text><text class="mono" x="22" y="80">direct_copy_format_supported</text><text class="body" x="22" y="112">resolver returns true</text><text class="yes" x="22" y="142">direct path allowed ✓</text></g>
  <g transform="translate(844 334)"><rect class="out" width="284" height="164" rx="20"/><text class="head" x="22" y="42">② Runtime executor</text><text class="body" x="22" y="78">select component base pointer</text><text class="body" x="22" y="106">resolve every block address</text><text class="yes" x="22" y="140">submit batch memcpy ✓</text></g>
  <g transform="translate(278 563)"><rect class="badge" width="624" height="48" rx="13"/><text class="body" x="312" y="30" text-anchor="middle">No new transfer algorithm—just a proven address rule for an existing fast path</text></g>
</svg>
