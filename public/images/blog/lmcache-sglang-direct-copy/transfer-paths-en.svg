<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="650" viewBox="0 0 1180 650" role="img" aria-labelledby="title desc">
  <title id="title">Kernel path and direct-copy path</title><desc id="desc">The left path uses pinned host memory, a GPU staging buffer, and a block-transfer kernel. The right path uses cudaMemcpyBatchAsync directly between pinned host memory and engine pages.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#121721"/><stop offset=".5" stop-color="#202a36"/><stop offset="1" stop-color="#0e141b"/></linearGradient><marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M2 2L10 6L2 10Z" fill="#91a4b6"/></marker><style>.title{fill:#f8fafc;font:800 31px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.sub{fill:#a9b8c6;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.lane{fill:#161f29;stroke:#506273;stroke-width:1.4}.fast{fill:#142a27;stroke:#79d8bd;stroke-width:1.8}.box{fill:#23313f;stroke:#718599;stroke-width:1.3}.hot{fill:#29453e;stroke:#9de6d2;stroke-width:1.7}.head{fill:#f1f5f9;font:800 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.body{fill:#d5dee7;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.micro{fill:#9fb0bf;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{fill:#9de6d2;font:700 14px ui-monospace,SFMono-Regular,Menlo,monospace}.edge{fill:none;stroke:#91a4b6;stroke-width:3;marker-end:url(#a)}.fastEdge{fill:none;stroke:#9de6d2;stroke-width:4;marker-end:url(#a)}.bad{fill:#eaa36f}.good{fill:#9de6d2}</style></defs>
  <rect width="1180" height="650" rx="28" fill="url(#bg)"/><text class="title" x="54" y="58">The same KV bytes, moved along two different routes</text><text class="sub" x="56" y="88">Direct copy removes an intermediate staging hop and an SM kernel—not the payload.</text>
  <g transform="translate(58 130)"><rect class="lane" width="510" height="432" rx="22"/><text class="head" x="26" y="43">General kernel path</text><text class="micro" x="26" y="69">Works with every EngineKVFormat</text><g transform="translate(105 96)"><rect class="box" width="300" height="64" rx="14"/><text class="body" x="150" y="28" text-anchor="middle">Pinned host object</text><text class="micro" x="150" y="49" text-anchor="middle">continuous LMCache chunk</text></g><path class="edge" d="M255 160L255 210"/><text class="mono" x="275" y="192">cudaMemcpyAsync</text><g transform="translate(105 210)"><rect class="box" width="300" height="64" rx="14"/><text class="body" x="150" y="28" text-anchor="middle">GPU staging buffer</text><text class="micro" x="150" y="49" text-anchor="middle">an extra landing point</text></g><path class="edge" d="M255 274L255 324"/><text class="mono" x="275" y="307">CUDA block kernel</text><g transform="translate(105 324)"><rect class="box" width="300" height="64" rx="14"/><text class="body" x="150" y="28" text-anchor="middle">Engine paged KV blocks</text><text class="micro" x="150" y="49" text-anchor="middle">gather / scatter by block ID</text></g><circle class="bad" cx="64" cy="235" r="7"><animate attributeName="cy" values="140;235;362" dur="2.8s" repeatCount="indefinite"/></circle></g>
  <g transform="translate(612 130)"><rect class="fast" width="510" height="432" rx="22"/><text class="head" x="26" y="43">Direct-copy fast path</text><text class="micro" x="26" y="69">Only contiguous-block, token-major layouts</text><g transform="translate(105 96)"><rect class="hot" width="300" height="64" rx="14"/><text class="body" x="150" y="28" text-anchor="middle">Pinned host object</text><text class="micro" x="150" y="49" text-anchor="middle">continuous LMCache chunk</text></g><path class="fastEdge" d="M255 160L255 324"/><text class="mono" x="276" y="242">cudaMemcpyBatchAsync</text><text class="micro" x="276" y="266">many DMA ranges · copy engine</text><g transform="translate(105 324)"><rect class="hot" width="300" height="64" rx="14"/><text class="body" x="150" y="28" text-anchor="middle">Engine paged KV blocks</text><text class="micro" x="150" y="49" text-anchor="middle">CPU resolved every block address</text></g><circle class="good" cx="64" cy="235" r="7"><animate attributeName="cy" values="140;362" dur="1.8s" repeatCount="indefinite"/></circle></g>
  <g transform="translate(297 590)"><text class="body" x="0" y="0"><tspan class="bad">General:</tspan> staging + SM kernel</text><text class="body" x="350" y="0"><tspan class="good">Direct:</tspan> batch DMA + copy engine</text></g>
</svg>
