<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="650" viewBox="0 0 1180 650" role="img" aria-labelledby="title desc">
  <title id="title">Traditional SGLang and unified MP KV layouts</title><desc id="desc">The traditional representation nests K layers and V layers in two groups. Unified MP flattens each independently allocated K or V component into a list of NB BS NH HS tensors.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111722"/><stop offset=".55" stop-color="#20283a"/><stop offset="1" stop-color="#0d141c"/></linearGradient><marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M2 2L10 6L2 10Z" fill="#8294a6"/></marker><style>.title{fill:#f8fafc;font:800 31px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.sub{fill:#a9b8c6;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.panel{fill:#17212d;stroke:#536779;stroke-width:1.4}.unified{fill:#172b28;stroke:#82d9c1;stroke-width:1.8}.head{fill:#f1f5f9;font:800 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.body{fill:#d5dee7;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.micro{fill:#9fb0bf;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{fill:#cceee5;font:700 14px ui-monospace,SFMono-Regular,Menlo,monospace}.k{fill:#233b54;stroke:#7cb7e8}.v{fill:#49324b;stroke:#d59ad5}.entry{fill:#1c2b35;stroke:#6f8495}.edge{fill:none;stroke:#8294a6;stroke-width:2.5;marker-end:url(#a)}.badge{fill:#0f1822;stroke:#425669}</style></defs>
  <rect width="1180" height="650" rx="28" fill="url(#bg)"/><text class="title" x="54" y="58">SGLang unified MP: from grouped K/V to independent components</text><text class="sub" x="56" y="88">The physical tensors are not fused; LMCache sees a flatter list and a different format descriptor.</text>
  <g transform="translate(58 132)"><rect class="panel" width="440" height="420" rx="22"/><text class="head" x="24" y="44">Traditional SGLang MP</text><text class="mono" x="24" y="74">TWO_X_NL_X_NB_BS_NH_HS</text><g transform="translate(34 112)"><rect class="k" width="372" height="112" rx="16"/><text class="body" x="18" y="30">K list</text><rect class="entry" x="18" y="48" width="102" height="42" rx="9"/><rect class="entry" x="135" y="48" width="102" height="42" rx="9"/><rect class="entry" x="252" y="48" width="102" height="42" rx="9"/><text class="micro" x="69" y="74" text-anchor="middle">K layer 0</text><text class="micro" x="186" y="74" text-anchor="middle">K layer 1</text><text class="micro" x="303" y="74" text-anchor="middle">…</text></g><g transform="translate(34 246)"><rect class="v" width="372" height="112" rx="16"/><text class="body" x="18" y="30">V list</text><rect class="entry" x="18" y="48" width="102" height="42" rx="9"/><rect class="entry" x="135" y="48" width="102" height="42" rx="9"/><rect class="entry" x="252" y="48" width="102" height="42" rx="9"/><text class="micro" x="69" y="74" text-anchor="middle">V layer 0</text><text class="micro" x="186" y="74" text-anchor="middle">V layer 1</text><text class="micro" x="303" y="74" text-anchor="middle">…</text></g><text class="micro" x="220" y="394" text-anchor="middle">Two nested levels: K/V plane → layer</text></g>
  <path class="edge" d="M498 342 C535 342 555 342 592 342"/><g transform="translate(515 292)"><rect class="badge" width="62" height="34" rx="9"/><text class="micro" x="31" y="22" text-anchor="middle">flatten</text></g>
  <g transform="translate(592 132)"><rect class="unified" width="530" height="420" rx="22"/><text class="head" x="24" y="44">Unified MP: each component registered alone</text><text class="mono" x="24" y="74">NL_X_NB_BS_NH_HS · format 18</text><g transform="translate(30 108)"><rect class="k" width="470" height="54" rx="12"/><rect class="k" y="66" width="470" height="54" rx="12"/><rect class="v" y="132" width="470" height="54" rx="12"/><rect class="v" y="198" width="470" height="54" rx="12"/><text class="body" x="18" y="33">entry 0 · K component 0</text><text class="mono" x="452" y="33" text-anchor="end">[NB, BS, NH, HS]</text><text class="body" x="18" y="99">entry 1 · K component 1</text><text class="mono" x="452" y="99" text-anchor="end">[NB, BS, NH, HS]</text><text class="body" x="18" y="165">entry 2 · V component 0</text><text class="mono" x="452" y="165" text-anchor="end">[NB, BS, NH, HS]</text><text class="body" x="18" y="231">entry 3 · V component 1</text><text class="mono" x="452" y="231" text-anchor="end">[NB, BS, NH, HS]</text></g><g transform="translate(30 378)"><text class="micro" x="0" y="0">NL = registered entries · kv_size = 1 · each entry owns a base pointer</text></g></g>
  <g transform="translate(304 586)"><rect class="badge" width="572" height="40" rx="12"/><text class="body" x="286" y="26" text-anchor="middle">Each component remains token-major and block-contiguous in NHD order</text></g>
</svg>
