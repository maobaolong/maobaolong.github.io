<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">几类 KV Cache 管理架构的权力分布</title>
  <desc id="desc">比较引擎内卸载、独立中间层、集中式存储、GPU 深度耦合管理器和 Router 引导的节点控制器。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08131f"/><stop offset="1" stop-color="#141b30"/></linearGradient>
    <style>.sans{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:36px;font-weight:750;fill:#f8fafc}.sub{font-size:18px;fill:#94a3b8}.h{font-size:20px;font-weight:700;fill:#f8fafc}.b{font-size:16px;fill:#cbd5e1}.mini{font-size:14px;font-weight:650}.axis{font-size:15px;fill:#94a3b8}</style>
  </defs>
  <rect width="1400" height="760" rx="28" fill="url(#bg)"/>
  <g class="sans">
    <text x="70" y="70" class="title">不同 KV Cache 架构，把“权力”放在哪里？</text>
    <text x="70" y="105" class="sub">没有绝对赢家；差异在于全局目录、GPU 所有权、节点策略和数据通路由谁承担</text>

    <text x="70" y="165" class="axis">更靠近单机 / 引擎</text><text x="1330" y="165" text-anchor="end" class="axis">更靠近集群 / 基础设施</text>
    <line x1="70" y1="190" x2="1330" y2="190" stroke="#475569" stroke-width="3"/>

    <g transform="translate(70 230)">
      <rect width="240" height="400" rx="22" fill="#132a32" stroke="#14b8a6" stroke-width="2"/>
      <text x="24" y="45" class="h">引擎内本地卸载</text>
      <text x="24" y="84" class="b">最懂本地调度</text><text x="24" y="112" class="b">数据路径最短</text>
      <rect x="24" y="150" width="192" height="34" rx="17" fill="#115e59"/><text x="120" y="172" text-anchor="middle" class="mini" fill="#ccfbf1">GPU：引擎单一权威</text>
      <rect x="24" y="198" width="108" height="30" rx="15" fill="#334155"/><text x="78" y="218" text-anchor="middle" class="mini" fill="#cbd5e1">全局目录：弱</text>
      <text x="24" y="278" class="b">代价</text><text x="24" y="310" class="b">跨节点复用有限</text><text x="24" y="338" class="b">容易重复 Prefill</text>
    </g>

    <g transform="translate(325 230)">
      <rect width="240" height="400" rx="22" fill="#20243a" stroke="#818cf8" stroke-width="2"/>
      <text x="24" y="45" class="h">独立缓存中间层</text>
      <text x="24" y="84" class="b">跨框架、多级存储</text><text x="24" y="112" class="b">进程隔离较清楚</text>
      <rect x="24" y="150" width="192" height="34" rx="17" fill="#3730a3"/><text x="120" y="172" text-anchor="middle" class="mini" fill="#e0e7ff">控制：独立服务</text>
      <rect x="24" y="198" width="145" height="30" rx="15" fill="#334155"/><text x="96" y="218" text-anchor="middle" class="mini" fill="#cbd5e1">全局目录：自建</text>
      <text x="24" y="278" class="b">代价</text><text x="24" y="310" class="b">IPC 与元数据边界</text><text x="24" y="338" class="b">需要独立发现机制</text>
    </g>

    <g transform="translate(580 230)">
      <rect width="240" height="400" rx="22" fill="#302517" stroke="#f59e0b" stroke-width="2"/>
      <text x="24" y="45" class="h">集中式外部存储</text>
      <text x="24" y="84" class="b">容量池化直观</text><text x="24" y="112" class="b">统一运维与持久化</text>
      <rect x="24" y="150" width="192" height="34" rx="17" fill="#92400e"/><text x="120" y="172" text-anchor="middle" class="mini" fill="#fef3c7">控制：中央服务</text>
      <rect x="24" y="198" width="158" height="30" rx="15" fill="#334155"/><text x="103" y="218" text-anchor="middle" class="mini" fill="#cbd5e1">全局目录：集中</text>
      <text x="24" y="278" class="b">代价</text><text x="24" y="310" class="b">热点与网络放大</text><text x="24" y="338" class="b">热路径延迟更敏感</text>
    </g>

    <g transform="translate(835 230)">
      <rect width="240" height="400" rx="22" fill="#311b29" stroke="#f472b6" stroke-width="2"/>
      <text x="24" y="45" class="h">GPU 深耦合管理器</text>
      <text x="24" y="84" class="b">细粒度布局优化</text><text x="24" y="112" class="b">可直接操作 block</text>
      <rect x="24" y="150" width="192" height="34" rx="17" fill="#9d174d"/><text x="120" y="172" text-anchor="middle" class="mini" fill="#fce7f3">GPU：可能双重控制</text>
      <rect x="24" y="198" width="145" height="30" rx="15" fill="#334155"/><text x="96" y="218" text-anchor="middle" class="mini" fill="#cbd5e1">耦合程度：高</text>
      <text x="24" y="278" class="b">代价</text><text x="24" y="310" class="b">追随模型布局变化</text><text x="24" y="338" class="b">争夺 GPU 执行资源</text>
    </g>

    <g transform="translate(1090 230)">
      <rect width="240" height="400" rx="22" fill="#2b1d42" stroke="#a78bfa" stroke-width="3"/>
      <text x="24" y="45" class="h">Router 引导控制器</text>
      <text x="24" y="84" class="b">全局提示、本地决定</text><text x="24" y="112" class="b">节点控制与传输解耦</text>
      <rect x="24" y="150" width="192" height="34" rx="17" fill="#6d28d9"/><text x="120" y="172" text-anchor="middle" class="mini" fill="#ede9fe">GPU：引擎单一权威</text>
      <rect x="24" y="198" width="192" height="30" rx="15" fill="#1d4ed8"/><text x="120" y="218" text-anchor="middle" class="mini" fill="#dbeafe">全局目录：Router 摘要</text>
      <text x="24" y="278" class="b">代价</text><text x="24" y="310" class="b">依赖 Hint 新鲜度</text><text x="24" y="338" class="b">协议与成本模型待成熟</text>
    </g>

    <text x="700" y="690" text-anchor="middle" class="sub">KVCC 的独特选择：不重复 Router 的地图，也不成为第二个 GPU 调度器</text>
  </g>
</svg>
