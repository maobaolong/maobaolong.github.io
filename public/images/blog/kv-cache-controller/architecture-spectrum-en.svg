```xml
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Power Distribution of Several Types of KV Cache Management Architectures</title>
  <desc id="desc">Comparing engine-local unloading, independent middleware, centralized storage, GPU tightly coupled managers, and Router-guided node controllers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08131f"/><stop offset="1" stop-color="#141b30"/></linearGradient>
    <style>.sans{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:36px;font-weight:750;fill:#f8fafc}.sub{font-size:18px;fill:#94a3b8}.h{font-size:20px;font-weight:700;fill:#f8fafc}.b{font-size:16px;fill:#cbd5e1}.mini{font-size:14px;font-weight:650}.axis{font-size:15px;fill:#94a3b8}</style>
  </defs>
  <rect width="1400" height="760" rx="28" fill="url(#bg)"/>
  <g class="sans">
    <text x="70" y="70" class="title">Where to Place "Power" in Different KV Cache Architectures?</text>
    <text x="70" y="105" class="sub">There are no absolute winners; the differences lie in who bears the global directory, GPU ownership, node policies, and data pathways.</text>

    <text x="70" y="165" class="axis">Closer to Single Machine / Engine</text><text x="1330" y="165" text-anchor="end" class="axis">Closer to Cluster / Infrastructure</text>
    <line x1="70" y1="190" x2="1330" y2="190" stroke="#475569" stroke-width="3"/>

    <g transform="translate(70 230)">
      <rect width="240" height="400" rx="22" fill="#132a32" stroke="#14b8a6" stroke-width="2"/>
      <text x="24" y="45" class="h">Engine-local Unloading</text>
      <text x="24" y="84" class="b">Best Understanding of Local Scheduling</text><text x="24" y="112" class="b">Shortest Data Path</text>
      <rect x="24" y="150" width="192" height="34" rx="17" fill="#115e59"/><text x="120" y="172" text-anchor="middle" class="mini" fill="#ccfbf1">GPU: Single Authority of Engine</text>
      <rect x="24" y="198" width="108" height="30" rx="15" fill="#334155"/><text x="78" y="218" text-anchor="middle" class="mini" fill="#cbd5e1">Global Directory: Weak</text>
      <text x="24" y="278" class="b">Cost</text><text x="24" y="310" class="b">Limited Cross-node Reuse</text><text x="24" y="338" class="b">Easy to Repeat Prefill</text>
    </g>

    <g transform="translate(325 230)">
      <rect width="240" height="400" rx="22" fill="#20243a" stroke="#818cf8" stroke-width="2"/>
      <text x="24" y="45" class="h">Independent Cache Middleware</text>
      <text x="24" y="84" class="b">Cross-framework, Multi-level Storage</text><text x="24" y="112" class="b">Clear Process Isolation</text>
      <rect x="24" y="150" width="192" height="34" rx="17" fill="#3730a3"/><text x="120" y="172" text-anchor="middle" class="mini" fill="#e0e7ff">Control: Independent Service</text>
      <rect x="24" y="198" width="145" height="30" rx="15" fill="#334155"/><text x="96" y="218" text-anchor="middle" class="mini" fill="#cbd5e1">Global Directory: Self-built</text>
      <text x="24" y="278" class="b">Cost</text><text x="24" y="310" class="b">IPC and Metadata Boundaries</text><text x="24" y="338" class="b">Requires Independent Discovery Mechanism</text>
    </g>

    <g transform="translate(580 230)">
      <rect width="240" height="400" rx="22" fill="#302517" stroke="#f59e0b" stroke-width="2"/>
      <text x="24" y="45" class="h">Centralized External Storage</text>
      <text x="24" y="84" class="b">Capacity Pooling is Intuitive</text><text x="24" y="112" class="b">Unified Operations and Persistence</text>
      <rect x="24" y="150" width="192" height="34" rx="17" fill="#92400e"/><text x="120" y="172" text-anchor="middle" class="mini" fill="#fef3c7">Control: Central Service</text>
      <rect x="24" y="198" width="158" height="30" rx="15" fill="#334155"/><text x="103" y="218" text-anchor="middle" class="mini" fill="#cbd5e1">Global Directory: Centralized</text>
      <text x="24" y="278" class="b">Cost</text><text x="24" y="310" class="b">Hotspots and Network Amplification</text><text x="24" y="338" class="b">Hot Path Latency More Sensitive</text>
    </g>

    <g transform="translate(835 230)">
      <rect width="240" height="400" rx="22" fill="#311b29" stroke="#f472b6" stroke-width="2"/>
      <text x="24" y="45" class="h">GPU Tightly Coupled Manager</text>
      <text x="24" y="84" class="b">Fine-grained Layout Optimization</text><text x="24" y="112" class="b">Can Directly Operate Block</text>
      <rect x="24" y="150" width="192" height="34" rx="17" fill="#9d174d"/><text x="120" y="172" text-anchor="middle" class="mini" fill="#fce7f3">GPU: Possible Dual Control</text>
      <rect x="24" y="198" width="145" height="30" rx="15" fill="#334155"/><text x="96" y="218" text-anchor="middle" class="mini" fill="#cbd5e1">Coupling Degree: High</text>
      <text x="24" y="278" class="b">Cost</text><text x="24" y="310" class="b">Follows Model Layout Changes</text><text x="24" y="338" class="b">Competes for GPU Execution Resources</text>
    </g>

    <g transform="translate(1090 230)">
      <rect width="240" height="400" rx="22" fill="#2b1d42" stroke="#a78bfa" stroke-width="3"/>
      <text x="24" y="45" class="h">Router-guided Controller</text>
      <text x="24" y="84" class="b">Global Hints, Local Decisions</text><text x="24" y="112" class="b">Node Control and Transport Decoupling</text>
      <rect x="24" y="150" width="192" height="34" rx="17" fill="#6d28d9"/><text x="120" y="172" text-anchor="middle" class="mini" fill="#ede9fe">GPU: Single Authority of Engine</text>
      <rect x="24" y="198" width="192" height="30" rx="15" fill="#1d4ed8"/><text x="120" y="218" text-anchor="middle" class="mini" fill="#dbeafe">Global Directory: Router Summary</text>
      <text x="24" y="278" class="b">Cost</text><text x="24" y="310" class="b">Depends on Hint Freshness</text><text x="24" y="338" class="b">Protocols and Cost Models Await Maturity</text>
    </g>

    <text x="700" y="690" text-anchor="middle" class="sub">Unique Choice of KVCC: Not Duplicating the Router's Map, Nor Becoming a Second GPU Scheduler</text>
  </g>
</svg>
```