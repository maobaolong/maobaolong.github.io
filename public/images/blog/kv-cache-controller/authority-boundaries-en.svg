```xml
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Role and Control Boundaries of KVCC</title>
  <desc id="desc">Router provides global KV location hints, the inference engine controls GPU and final scheduling, KVCC manages node caching, NIXL executes data transport, and Guard provides optional fault recovery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111c35"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
    <style>
      .sans{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}
      .title{font-size:36px;font-weight:750;fill:#f8fafc}
      .subtitle{font-size:18px;fill:#94a3b8}
      .boxTitle{font-size:25px;font-weight:700;fill:#f8fafc}
      .body{font-size:18px;fill:#cbd5e1}
      .small{font-size:16px;fill:#94a3b8}
      .pill{font-size:15px;font-weight:650}
    </style>
  </defs>
  <rect width="1400" height="860" rx="28" fill="url(#bg)"/>
  <g class="sans">
    <text x="70" y="70" class="title">Role and Control Boundaries of KVCC</text>
    <text x="70" y="105" class="subtitle">Core Principles: Global Map, Local Decisions, GPU Single Authority, Transport Layer Independent Evolution</text>

    <g filter="url(#shadow)">
      <rect x="420" y="145" width="560" height="145" rx="24" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
      <text x="455" y="190" class="boxTitle">KV Router · Global Map</text>
      <text x="455" y="225" class="body">Maintains a summary of final consistent key / node locations</text>
      <text x="455" y="257" class="body">Routes requests and attaches candidate source hints</text>
      <rect x="810" y="168" width="135" height="35" rx="17" fill="#1d4ed8"/>
      <text x="877" y="191" text-anchor="middle" class="pill" fill="#dbeafe">Suggestion, not command</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="70" y="375" width="390" height="235" rx="24" fill="#132a32" stroke="#14b8a6" stroke-width="2"/>
      <text x="105" y="420" class="boxTitle">Inference Engine · GPU Authority</text>
      <text x="105" y="460" class="body">• Controls G1 HBM and execution scheduling</text>
      <text x="105" y="495" class="body">• Generates transport-friendly specification layouts</text>
      <text x="105" y="530" class="body">• Final decision on Fetch or recompute</text>
      <text x="105" y="565" class="body">• Provides a secure target memory window</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="505" y="345" width="390" height="295" rx="24" fill="#2b1d42" stroke="#a78bfa" stroke-width="2.5"/>
      <text x="540" y="390" class="boxTitle">KVCC / KVCR · Node Manager</text>
      <text x="540" y="433" class="body">• Local residency and admission policies</text>
      <text x="540" y="468" class="body">• Operation / Claim lifecycle</text>
      <text x="540" y="503" class="body">• G2 / G3 / G4 elimination and sinking</text>
      <text x="540" y="538" class="body">• Orchestrates remote retrieval based on hints</text>
      <text x="540" y="573" class="body">• Publishes incremental inventory of this node</text>
      <rect x="540" y="594" width="320" height="29" rx="14" fill="#6d28d9"/>
      <text x="700" y="614" text-anchor="middle" class="pill" fill="#ede9fe">Does not take over G1 in use by the engine</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="940" y="375" width="390" height="235" rx="24" fill="#302517" stroke="#f59e0b" stroke-width="2"/>
      <text x="975" y="420" class="boxTitle">NIXL · Data Path</text>
      <text x="975" y="460" class="body">• GPU / DRAM / NVMe</text>
      <text x="975" y="495" class="body">• UCX / RDMA / Network connections</text>
      <text x="975" y="530" class="body">• Object or file storage plugins</text>
      <text x="975" y="565" class="body">• Executes transport without formulating policies</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="390" y="710" width="620" height="95" rx="24" fill="#25202b" stroke="#64748b" stroke-width="2" stroke-dasharray="9 7"/>
      <text x="425" y="750" class="boxTitle">KVCR-Guard · Optional Recovery Bypass</text>
      <text x="425" y="782" class="small">Isolates failed owner, retains committed controller memory, assists with hot restart and takeover</text>
    </g>

    <path d="M700 290 L700 335" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <text x="718" y="321" class="small">Hint</text>
    <path d="M505 465 C480 465,480 465,462 465" stroke="#34d399" stroke-width="4" marker-end="url(#arrowGreen)"/>
    <path d="M895 465 C920 465,920 465,938 465" stroke="#34d399" stroke-width="4" marker-end="url(#arrowGreen)"/>
    <path d="M700 640 L700 701" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 7"/>
    <text x="270" y="665" text-anchor="middle" class="small">Control Plane: Metadata, Hint, State</text>
    <line x1="95" y1="690" x2="445" y2="690" stroke="#60a5fa" stroke-width="4"/>
    <text x="1135" y="665" text-anchor="middle" class="small">Data Plane: Operation-oriented transport</text>
    <line x1="960" y1="690" x2="1310" y2="690" stroke="#34d399" stroke-width="4"/>
  </g>
</svg>
```