<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="480" viewBox="0 0 1040 480" role="img" aria-labelledby="title desc">
  <title id="title">LMCache request transport boundary</title>
  <desc id="desc">The vLLM connector and cache server modules keep the same request contract while the transport factory selects either ZMQ or gRPC.</desc>
  <style>
    :root {
      color-scheme: light dark;
    }
    svg {
      --bg: #f8fafc;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #617089;
      --line: #c8d2e0;
      --blue: #2563eb;
      --green: #059669;
      --amber: #d97706;
      --soft-blue: #dbeafe;
      --soft-green: #d1fae5;
      --soft-amber: #fef3c7;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #111827;
        --panel: #172033;
        --ink: #e5edf7;
        --muted: #a7b3c5;
        --line: #334155;
        --blue: #93c5fd;
        --green: #6ee7b7;
        --amber: #fbbf24;
        --soft-blue: #1e3a5f;
        --soft-green: #164437;
        --soft-amber: #473510;
      }
    }
    .bg { fill: var(--bg); }
    .box { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; rx: 14; }
    .soft-blue { fill: var(--soft-blue); stroke: var(--blue); }
    .soft-green { fill: var(--soft-green); stroke: var(--green); }
    .soft-amber { fill: var(--soft-amber); stroke: var(--amber); }
    .title { fill: var(--ink); font-size: 20px; font-weight: 600; }
    .label { fill: var(--ink); font-size: 17px; font-weight: 600; }
    .text { fill: var(--muted); font-size: 14px; }
    .small { fill: var(--muted); font-size: 13px; }
    .arrow { fill: none; stroke: var(--line); stroke-width: 2.2; marker-end: url(#arrow); }
    .blue-line { stroke: var(--blue); }
    .green-line { stroke: var(--green); }
    .tag { fill: var(--panel); stroke: var(--line); stroke-width: 1; rx: 11; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1040" height="480" rx="18" />
  <text class="title" x="44" y="52">把“请求语义”和“传输方式”拆开</text>
  <text class="text" x="44" y="82">PR #4953 的关键不是让业务模块改写成 gRPC，而是让同一套 RequestType 可以从不同 transport 进来。</text>

  <rect class="box soft-blue" x="54" y="150" width="205" height="96" />
  <text class="label" x="84" y="188">vLLM / MP clients</text>
  <text class="text" x="84" y="216">lookup / store / ping</text>

  <rect class="box" x="330" y="132" width="230" height="132" />
  <text class="label" x="368" y="172">RequestClientFactory</text>
  <text class="text" x="368" y="202">看 URL scheme</text>
  <text class="small" x="368" y="230">tcp:// → ZMQ</text>
  <text class="small" x="368" y="250">grpc:// → gRPC</text>

  <rect class="box soft-green" x="650" y="104" width="180" height="92" />
  <text class="label" x="703" y="140">ZMQ</text>
  <text class="text" x="686" y="168">legacy path</text>

  <rect class="box soft-amber" x="650" y="250" width="180" height="92" />
  <text class="label" x="699" y="286">gRPC</text>
  <text class="text" x="679" y="314">new path</text>

  <rect class="box" x="875" y="158" width="120" height="130" />
  <text class="label" x="907" y="196">Modules</text>
  <text class="small" x="904" y="224">Lookup</text>
  <text class="small" x="904" y="246">Transfer</text>
  <text class="small" x="904" y="268">Manage</text>

  <path class="arrow" d="M259 198 L330 198" />
  <path class="arrow green-line" d="M560 185 C595 156 612 150 650 150" />
  <path class="arrow blue-line" d="M560 211 C594 262 612 296 650 296" />
  <path class="arrow green-line" d="M830 150 C858 152 864 176 875 196" />
  <path class="arrow blue-line" d="M830 296 C858 294 864 256 875 232" />

  <rect class="tag" x="116" y="306" width="245" height="42" />
  <text class="small" x="139" y="332">业务调用仍是 client.lookup(...)</text>
  <rect class="tag" x="388" y="306" width="206" height="42" />
  <text class="small" x="410" y="332">选择发生在 endpoint</text>
  <rect class="tag" x="620" y="383" width="332" height="42" />
  <text class="small" x="642" y="409">server 端用 --transport 选择暴露哪种 request server</text>
</svg>
