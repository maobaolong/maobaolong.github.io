<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" role="img" aria-labelledby="title desc">
  <title id="title">gRPC request call path</title>
  <desc id="desc">A method call on the gRPC client is encoded, sent as a unary RPC, dispatched to a module handler, encoded back, and surfaced as a MessagingFuture.</desc>
  <style>
    :root { color-scheme: light dark; }
    svg {
      --bg: #f8fafc;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #617089;
      --line: #c8d2e0;
      --blue: #2563eb;
      --green: #059669;
      --amber: #d97706;
      --soft-blue: #dbeafe;
      --soft-green: #d1fae5;
      --soft-amber: #fef3c7;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #111827;
        --panel: #172033;
        --ink: #e5edf7;
        --muted: #a7b3c5;
        --line: #334155;
        --blue: #93c5fd;
        --green: #6ee7b7;
        --amber: #fbbf24;
        --soft-blue: #1e3a5f;
        --soft-green: #164437;
        --soft-amber: #473510;
      }
    }
    .bg { fill: var(--bg); }
    .box { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; rx: 14; }
    .blue { fill: var(--soft-blue); stroke: var(--blue); }
    .green { fill: var(--soft-green); stroke: var(--green); }
    .amber { fill: var(--soft-amber); stroke: var(--amber); }
    .title { fill: var(--ink); font-size: 20px; font-weight: 600; }
    .label { fill: var(--ink); font-size: 16px; font-weight: 600; }
    .text { fill: var(--muted); font-size: 13px; }
    .mono { fill: var(--muted); font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .arrow { fill: none; stroke: var(--line); stroke-width: 2.2; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)" />
    </marker>
  </defs>
  <rect class="bg" width="1040" height="420" rx="18" />
  <text class="title" x="44" y="52">一次 gRPC 调用怎样穿过 LMCache MP</text>

  <rect class="box blue" x="42" y="130" width="150" height="96" />
  <text class="label" x="70" y="166">client.store</text>
  <text class="mono" x="70" y="194">args / kwargs</text>

  <rect class="box" x="242" y="130" width="150" height="96" />
  <text class="label" x="278" y="166">codec</text>
  <text class="mono" x="270" y="194">to protobuf</text>

  <rect class="box amber" x="442" y="130" width="150" height="96" />
  <text class="label" x="483" y="166">gRPC</text>
  <text class="mono" x="470" y="194">unary future</text>

  <rect class="box" x="642" y="130" width="150" height="96" />
  <text class="label" x="674" y="166">servicer</text>
  <text class="mono" x="667" y="194">decode + route</text>

  <rect class="box green" x="842" y="130" width="150" height="96" />
  <text class="label" x="872" y="166">module</text>
  <text class="mono" x="872" y="194">store / lookup</text>

  <path class="arrow" d="M192 178 L242 178" />
  <path class="arrow" d="M392 178 L442 178" />
  <path class="arrow" d="M592 178 L642 178" />
  <path class="arrow" d="M792 178 L842 178" />

  <path class="arrow" d="M917 226 C917 290 135 290 117 226" />
  <text class="text" x="360" y="318">response 反向经过 response_encoder / response_decoder，最后落到 MessagingFuture</text>

  <rect class="box" x="142" y="352" width="760" height="38" />
  <text class="text" x="178" y="376">对调用方来说，`client.store(...).result()` 的形状没有变；变化藏在 transport 和 codec 后面。</text>
</svg>
