<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="430" viewBox="0 0 1040 430" role="img" aria-labelledby="title desc">
  <title id="title">ZMQ, gRPC, and autostart compatibility</title>
  <desc id="desc">Existing ZMQ deployments continue to use tcp endpoints. gRPC uses grpc endpoints and matching server transport. Autostart remains a ZMQ-only convenience until it learns transport selection.</desc>
  <style>
    :root { color-scheme: light dark; }
    svg {
      --bg: #f8fafc;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #617089;
      --line: #c8d2e0;
      --blue: #2563eb;
      --green: #059669;
      --amber: #d97706;
      --red: #dc2626;
      --soft-blue: #dbeafe;
      --soft-green: #d1fae5;
      --soft-amber: #fef3c7;
      --soft-red: #fee2e2;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #111827;
        --panel: #172033;
        --ink: #e5edf7;
        --muted: #a7b3c5;
        --line: #334155;
        --blue: #93c5fd;
        --green: #6ee7b7;
        --amber: #fbbf24;
        --red: #fca5a5;
        --soft-blue: #1e3a5f;
        --soft-green: #164437;
        --soft-amber: #473510;
        --soft-red: #4b1d24;
      }
    }
    .bg { fill: var(--bg); }
    .box { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; rx: 14; }
    .green { fill: var(--soft-green); stroke: var(--green); }
    .blue { fill: var(--soft-blue); stroke: var(--blue); }
    .amber { fill: var(--soft-amber); stroke: var(--amber); }
    .red { fill: var(--soft-red); stroke: var(--red); }
    .title { fill: var(--ink); font-size: 20px; font-weight: 600; }
    .label { fill: var(--ink); font-size: 16px; font-weight: 600; }
    .text { fill: var(--muted); font-size: 13px; }
    .mono { fill: var(--muted); font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .arrow { fill: none; stroke: var(--line); stroke-width: 2.2; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)" />
    </marker>
  </defs>
  <rect class="bg" width="1040" height="430" rx="18" />
  <text class="title" x="44" y="52">兼容性要看 endpoint 和 server transport 是否成对</text>

  <rect class="box green" x="62" y="125" width="260" height="108" />
  <text class="label" x="92" y="162">现有默认路径</text>
  <text class="mono" x="92" y="190">lmcache.mp.host = tcp://localhost</text>
  <text class="mono" x="92" y="212">lmcache server --transport zmq</text>

  <rect class="box blue" x="390" y="125" width="260" height="108" />
  <text class="label" x="420" y="162">新 gRPC 路径</text>
  <text class="mono" x="420" y="190">lmcache.mp.host = grpc://localhost</text>
  <text class="mono" x="420" y="212">lmcache server --transport grpc</text>

  <rect class="box amber" x="718" y="125" width="260" height="108" />
  <text class="label" x="748" y="162">当前 AutoStart</text>
  <text class="mono" x="748" y="190">expects tcp:// local endpoint</text>
  <text class="mono" x="748" y="212">starts server without --transport</text>

  <path class="arrow" d="M322 179 L390 179" />
  <path class="arrow" d="M650 179 L718 179" />

  <rect class="box" x="80" y="294" width="250" height="70" />
  <text class="label" x="110" y="324">ZMQ autostart</text>
  <text class="text" x="110" y="348">平滑继续工作</text>

  <rect class="box red" x="394" y="294" width="250" height="70" />
  <text class="label" x="424" y="324">gRPC autostart</text>
  <text class="text" x="424" y="348">需要后续适配</text>

  <rect class="box" x="708" y="294" width="250" height="70" />
  <text class="label" x="738" y="324">CI matrix</text>
  <text class="text" x="738" y="348">常规场景跑 ZMQ/gRPC，autostart 先保持 ZMQ-only</text>
</svg>
