<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc">
  <title id="title">gRPC codec registry</title>
  <desc id="desc">Generated protobuf services, RequestType, and Python payload annotations meet in a method codec registry.</desc>
  <style>
    :root { color-scheme: light dark; }
    svg {
      --bg: #f8fafc;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #617089;
      --line: #c8d2e0;
      --blue: #2563eb;
      --purple: #7c3aed;
      --green: #059669;
      --soft-blue: #dbeafe;
      --soft-purple: #ede9fe;
      --soft-green: #d1fae5;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #111827;
        --panel: #172033;
        --ink: #e5edf7;
        --muted: #a7b3c5;
        --line: #334155;
        --blue: #93c5fd;
        --purple: #c4b5fd;
        --green: #6ee7b7;
        --soft-blue: #1e3a5f;
        --soft-purple: #34245e;
        --soft-green: #164437;
      }
    }
    .bg { fill: var(--bg); }
    .box { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; rx: 14; }
    .blue { fill: var(--soft-blue); stroke: var(--blue); }
    .purple { fill: var(--soft-purple); stroke: var(--purple); }
    .green { fill: var(--soft-green); stroke: var(--green); }
    .title { fill: var(--ink); font-size: 20px; font-weight: 600; }
    .label { fill: var(--ink); font-size: 17px; font-weight: 600; }
    .text { fill: var(--muted); font-size: 14px; }
    .mono { fill: var(--muted); font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .arrow { fill: none; stroke: var(--line); stroke-width: 2.2; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)" />
    </marker>
  </defs>
  <rect class="bg" width="1040" height="520" rx="18" />
  <text class="title" x="44" y="52">codec registry 是 gRPC 路径的“对账本”</text>
  <text class="text" x="44" y="82">它把 protobuf 方法、RequestType、Python payload/response 类型放到同一张表里，启动时就能发现不匹配。</text>

  <rect class="box blue" x="58" y="145" width="230" height="124" />
  <text class="label" x="86" y="182">生成的 proto 服务</text>
  <text class="mono" x="86" y="212">LookupService.Lookup</text>
  <text class="mono" x="86" y="236">LMCacheDriven.Store</text>

  <rect class="box purple" x="58" y="330" width="230" height="102" />
  <text class="label" x="86" y="366">已有协议定义</text>
  <text class="mono" x="86" y="396">RequestType.LOOKUP</text>
  <text class="mono" x="86" y="418">payload classes</text>

  <rect class="box" x="384" y="210" width="270" height="140" />
  <text class="label" x="432" y="250">GrpcMethodCodec</text>
  <text class="text" x="432" y="280">request encoder / decoder</text>
  <text class="text" x="432" y="306">response encoder / decoder</text>
  <text class="text" x="432" y="332">handler annotation validation</text>

  <rect class="box green" x="750" y="172" width="220" height="92" />
  <text class="label" x="790" y="210">client 使用</text>
  <text class="text" x="790" y="238">Python 参数 → protobuf</text>

  <rect class="box green" x="750" y="318" width="220" height="92" />
  <text class="label" x="790" y="356">server 使用</text>
  <text class="text" x="790" y="384">protobuf → module handler</text>

  <path class="arrow" d="M288 207 C330 220 348 244 384 258" />
  <path class="arrow" d="M288 382 C330 363 348 328 384 306" />
  <path class="arrow" d="M654 264 C696 245 714 222 750 218" />
  <path class="arrow" d="M654 320 C694 334 713 361 750 364" />

  <text class="mono" x="392" y="398">method.full_name → codec</text>
  <text class="mono" x="392" y="423">RequestType → handler</text>
</svg>
