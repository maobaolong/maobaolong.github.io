<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="660" viewBox="0 0 1160 660" role="img" aria-labelledby="title desc">
  <title id="title">Sub-paged attention re-view dimensions</title>
  <desc id="desc">A diagram explaining how a kernel-paged attention tensor is re-viewed as logical-block pages dimension by dimension.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
      .src { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
      .dst { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; }
      .warn { fill: #fff7ed; stroke: #f97316; stroke-width: 1.4; }
      .dim0 { fill: #dbeafe; stroke: #2563eb; stroke-width: 1; }
      .dim1 { fill: #fed7aa; stroke: #f97316; stroke-width: 1; }
      .dim2 { fill: #dcfce7; stroke: #22c55e; stroke-width: 1; }
      .dim3 { fill: #ede9fe; stroke: #7c3aed; stroke-width: 1; }
      .dim4 { fill: #fce7f3; stroke: #db2777; stroke-width: 1; }
      .title { fill: #0f172a; font: 700 22px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .heading { fill: #0f172a; font: 700 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #64748b; font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #334155; font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .map { stroke: #94a3b8; stroke-width: 1.3; stroke-dasharray: 4 5; fill: none; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#334155" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1160" height="660" rx="18" />
  <text class="title" x="40" y="46">Example E: the re-view keeps bytes, but changes the shape vocabulary</text>
  <text class="muted" x="40" y="74">This is a zero-copy view: no byte is moved; LMCache only changes how the same storage is indexed.</text>

  <rect class="panel" x="40" y="112" width="1080" height="206" rx="14" />
  <text class="heading" x="66" y="148">Raw worker tensor: kernel-page coordinates</text>
  <text class="small" x="66" y="176">[num_kernel_pages, 2, 32, H, C]</text>
  <g transform="translate(66 210)">
    <rect class="dim0" x="0" y="0" width="220" height="52" rx="8" />
    <rect class="dim1" x="232" y="0" width="80" height="52" rx="8" />
    <rect class="dim2" x="324" y="0" width="90" height="52" rx="8" />
    <rect class="dim3" x="426" y="0" width="80" height="52" rx="8" />
    <rect class="dim4" x="518" y="0" width="80" height="52" rx="8" />
    <text class="small" x="18" y="23">num_kernel_pages</text>
    <text class="small" x="18" y="42">physical page count</text>
    <text class="small" x="260" y="32">2</text>
    <text class="small" x="348" y="32">32</text>
    <text class="small" x="456" y="32">H</text>
    <text class="small" x="548" y="32">C</text>
    <text class="muted" x="632" y="20">first dimension counts 32-token kernel pages</text>
    <text class="muted" x="632" y="46">the tensor is contiguous, so view can regroup elements</text>
  </g>

  <path class="arrow" d="M580 318 L580 382" />
  <text class="small" x="616" y="354">ratio = logical_block_size / kernel_block_size = 544 / 32 = 17</text>

  <rect class="panel" x="40" y="382" width="1080" height="206" rx="14" />
  <text class="heading" x="66" y="418">Registered tensor: logical-block coordinates</text>
  <text class="small" x="66" y="446">[num_logical_blocks, 2, 544, 1, C']</text>
  <g transform="translate(66 480)">
    <rect class="dim0" x="0" y="0" width="220" height="52" rx="8" />
    <rect class="dim1" x="232" y="0" width="80" height="52" rx="8" />
    <rect class="dim2" x="324" y="0" width="90" height="52" rx="8" />
    <rect class="dim3" x="426" y="0" width="80" height="52" rx="8" />
    <rect class="dim4" x="518" y="0" width="80" height="52" rx="8" />
    <text class="small" x="14" y="23">num_logical_blocks</text>
    <text class="small" x="14" y="42">num_kernel_pages / 17</text>
    <text class="small" x="260" y="32">2</text>
    <text class="small" x="344" y="32">544</text>
    <text class="small" x="462" y="32">1</text>
    <text class="small" x="538" y="32">C'</text>
    <text class="muted" x="632" y="20">one logical block covers 17 contiguous kernel pages</text>
    <text class="muted" x="632" y="46">C' is derived from page bytes; in the simple case C' = H * C</text>
  </g>

  <path class="map" d="M176 262 C176 334 176 408 176 480" />
  <path class="map" d="M272 262 C272 334 272 408 272 480" />
  <path class="map" d="M369 262 C369 334 369 408 369 480" />
  <path class="map" d="M466 262 C466 334 466 408 466 480" />
  <path class="map" d="M558 262 C558 334 558 408 558 480" />

  <rect class="warn" x="180" y="606" width="800" height="34" rx="8" />
  <text class="small" x="206" y="628">After this view, the middle dimensions are transfer-shape axes, not reliable semantic K/V/head axes.</text>
</svg>
