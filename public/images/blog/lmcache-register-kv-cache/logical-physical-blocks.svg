<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="660" viewBox="0 0 1160 660" role="img" aria-labelledby="title desc">
  <title id="title">Logical block and physical kernel pages</title>
  <desc id="desc">A diagram showing a 544-token logical block composed of 17 physical 32-token kernel pages.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
      .logical { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.6; }
      .phys { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.2; }
      .lmcache { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.4; }
      .tensor { fill: #fff7ed; stroke: #f97316; stroke-width: 1.4; }
      .title { fill: #0f172a; font: 700 22px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .heading { fill: #0f172a; font: 700 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #64748b; font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #334155; font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 4 4; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#334155" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1160" height="660" rx="18" />
  <text class="title" x="40" y="46">Example D: one logical block can be many physical/kernel pages</text>
  <text class="muted" x="40" y="74">vLLM block ids live in logical coordinates; attention kernels may still store smaller pages.</text>

  <rect class="panel" x="40" y="112" width="1080" height="190" rx="14" />
  <text class="heading" x="66" y="148">Scheduler / block table view</text>
  <text class="small" x="66" y="178">request prefix block ids: [40, 41, ...]</text>
  <rect class="logical" x="66" y="208" width="484" height="56" rx="8" />
  <text class="small" x="88" y="242">logical block 40: token slots 0..543</text>
  <rect class="logical" x="582" y="208" width="484" height="56" rx="8" />
  <text class="small" x="604" y="242">logical block 41: token slots 544..1087</text>

  <path class="arrow" d="M308 302 L308 350" />
  <path class="arrow" d="M824 302 L824 350" />

  <rect class="panel" x="40" y="350" width="1080" height="150" rx="14" />
  <text class="heading" x="66" y="386">Worker tensor / kernel view</text>
  <text class="small" x="66" y="414">raw tensor first dim counts physical pages: [num_kernel_pages, 2, 32, H, C]</text>
  <g transform="translate(66 442)">
    <rect class="phys" x="0" y="0" width="42" height="36" rx="5" /><text class="small" x="8" y="24">p0</text>
    <rect class="phys" x="48" y="0" width="42" height="36" rx="5" /><text class="small" x="56" y="24">p1</text>
    <rect class="phys" x="96" y="0" width="42" height="36" rx="5" /><text class="small" x="104" y="24">p2</text>
    <rect class="phys" x="144" y="0" width="42" height="36" rx="5" /><text class="small" x="149" y="24">...</text>
    <rect class="phys" x="192" y="0" width="42" height="36" rx="5" /><text class="small" x="194" y="24">p16</text>
    <text class="small" x="254" y="24">= logical block 40</text>

    <rect class="phys" x="520" y="0" width="42" height="36" rx="5" /><text class="small" x="522" y="24">p17</text>
    <rect class="phys" x="568" y="0" width="42" height="36" rx="5" /><text class="small" x="570" y="24">p18</text>
    <rect class="phys" x="616" y="0" width="42" height="36" rx="5" /><text class="small" x="618" y="24">p19</text>
    <rect class="phys" x="664" y="0" width="42" height="36" rx="5" /><text class="small" x="669" y="24">...</text>
    <rect class="phys" x="712" y="0" width="42" height="36" rx="5" /><text class="small" x="714" y="24">p33</text>
    <text class="small" x="774" y="24">= logical block 41</text>
  </g>

  <path class="arrow" d="M580 500 L580 548" />
  <rect class="lmcache" x="230" y="548" width="700" height="74" rx="12" />
  <text class="heading" x="258" y="580">LMCache register-time re-view</text>
  <text class="small" x="258" y="606">[num_kernel_pages, 2, 32, H, C] -> [num_logical_blocks, 2, 544, 1, C']</text>
</svg>
