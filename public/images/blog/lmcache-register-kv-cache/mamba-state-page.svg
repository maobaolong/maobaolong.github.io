<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="600" viewBox="0 0 1160 600" role="img" aria-labelledby="title desc">
  <title id="title">Attention page versus Mamba state page</title>
  <desc id="desc">A diagram comparing token-based attention KV cache pages with Mamba recurrent state pages.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
      .attn { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
      .mamba { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.6; }
      .conv { fill: #bfdbfe; stroke: #2563eb; stroke-width: 1.2; }
      .ssm { fill: #bbf7d0; stroke: #16a34a; stroke-width: 1.2; }
      .pad { fill: #e5e7eb; stroke: #94a3b8; stroke-width: 1.2; }
      .slot { fill: #dbeafe; stroke: #60a5fa; stroke-width: 1; }
      .title { fill: #0f172a; font: 700 22px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .heading { fill: #0f172a; font: 700 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .text { fill: #0f172a; font: 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #64748b; font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #334155; font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#334155" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1160" height="600" rx="18" />
  <text class="title" x="40" y="46">Example B: Mamba page is a state snapshot, not rows of per-token K/V</text>
  <text class="muted" x="40" y="74">Attention slot 通常对应一个 token 位置；Mamba 的 page payload 更多是在保存 recurrent state bytes。</text>

  <rect class="panel" x="40" y="112" width="510" height="380" rx="14" />
  <text class="heading" x="66" y="148">Attention cache page</text>
  <text class="small" x="66" y="176">shape: [num_blocks, 2, block_size, H, C]</text>
  <text class="muted" x="66" y="202">page contains token slots</text>

  <g transform="translate(66 232)">
    <rect class="attn" x="0" y="0" width="458" height="150" rx="10" />
    <text class="small" x="18" y="28">slot 0</text>
    <text class="small" x="18" y="58">slot 1</text>
    <text class="small" x="18" y="88">slot 2</text>
    <text class="small" x="18" y="118">...</text>
    <rect class="slot" x="100" y="14" width="140" height="20" rx="4" />
    <rect class="slot" x="260" y="14" width="140" height="20" rx="4" />
    <text class="small" x="148" y="29">K row</text>
    <text class="small" x="308" y="29">V row</text>
    <rect class="slot" x="100" y="44" width="140" height="20" rx="4" />
    <rect class="slot" x="260" y="44" width="140" height="20" rx="4" />
    <rect class="slot" x="100" y="74" width="140" height="20" rx="4" />
    <rect class="slot" x="260" y="74" width="140" height="20" rx="4" />
    <rect class="slot" x="100" y="104" width="140" height="20" rx="4" />
    <rect class="slot" x="260" y="104" width="140" height="20" rx="4" />
  </g>
  <text class="muted" x="66" y="430">block_size grows -> page bytes grows almost linearly</text>

  <rect class="panel" x="610" y="112" width="510" height="380" rx="14" />
  <text class="heading" x="636" y="148">Mamba / recurrent cache page</text>
  <text class="small" x="636" y="176">MambaSpec.shapes + dtypes -> state_content_size_bytes</text>
  <text class="muted" x="636" y="202">page contains state tensors plus optional padding</text>

  <g transform="translate(636 232)">
    <rect class="mamba" x="0" y="0" width="458" height="150" rx="10" />
    <rect class="conv" x="26" y="48" width="116" height="54" rx="6" />
    <rect class="ssm" x="150" y="48" width="210" height="54" rx="6" />
    <rect class="pad" x="368" y="48" width="62" height="54" rx="6" />
    <text class="small" x="48" y="80">conv</text>
    <text class="small" x="224" y="80">ssm state</text>
    <text class="small" x="382" y="80">pad</text>
    <text class="small" x="26" y="126">one page payload = state snapshot bytes</text>
  </g>
  <text class="muted" x="636" y="430">changing attention block_size does not describe these bytes</text>

  <path class="arrow" d="M550 302 C574 302 586 302 610 302" />
  <text class="muted" x="300" y="528">关键区别：attention 的 slot 是 token-position storage；</text>
  <text class="muted" x="300" y="552">Mamba 的 state page 是 recurrent state storage。</text>
</svg>
