<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="620" viewBox="0 0 1160 620" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid page size alignment example</title>
  <desc id="desc">A diagram showing attention page size alignment with a larger Mamba recurrent state page.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
      .attn { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.4; }
      .mamba { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.4; }
      .warn { fill: #fff7ed; stroke: #f97316; stroke-width: 1.4; }
      .seg { fill: #bfdbfe; stroke: #2563eb; stroke-width: 1; }
      .title { fill: #0f172a; font: 700 22px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .heading { fill: #0f172a; font: 700 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #64748b; font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #334155; font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#334155" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1160" height="620" rx="18" />
  <text class="title" x="40" y="46">Example C: page-size alignment is byte alignment, not token-count alignment</text>
  <text class="muted" x="40" y="74">The hybrid allocator hopes to manage a page of different KV groups uniformly on the byte ledger.</text>

  <rect class="panel" x="40" y="112" width="500" height="360" rx="14" />
  <text class="heading" x="66" y="148">Before alignment</text>
  <text class="muted" x="66" y="176">The attention backend natural page is small</text>
  <rect class="attn" x="66" y="218" width="42" height="48" rx="6" />
  <text class="small" x="124" y="248">Attention kernel page: 32 tokens = X bytes</text>

  <text class="muted" x="66" y="314">The Mamba recurrent state page is larger</text>
  <rect class="mamba" x="66" y="344" width="382" height="48" rx="6" />
  <text class="small" x="466" y="374">17X bytes</text>
  <text class="small" x="82" y="374">conv_state + ssm_state + padding</text>

  <rect class="warn" x="66" y="418" width="408" height="34" rx="8" />
  <text class="small" x="86" y="440">One page means different byte amounts across groups</text>

  <path class="arrow" d="M540 292 C572 292 586 292 620 292" />
  <text class="muted" x="552" y="270">vLLM aligns</text>

  <rect class="panel" x="620" y="112" width="500" height="420" rx="14" />
  <text class="heading" x="646" y="148">After alignment</text>
  <text class="muted" x="646" y="176">The attention manager block becomes larger</text>

  <g transform="translate(646 220)">
    <rect class="seg" x="0" y="0" width="24" height="48" rx="4" />
    <rect class="seg" x="26" y="0" width="24" height="48" rx="4" />
    <rect class="seg" x="52" y="0" width="24" height="48" rx="4" />
    <rect class="seg" x="78" y="0" width="24" height="48" rx="4" />
    <rect class="seg" x="104" y="0" width="24" height="48" rx="4" />
    <rect class="seg" x="130" y="0" width="24" height="48" rx="4" />
    <rect class="seg" x="156" y="0" width="24" height="48" rx="4" />
    <rect class="seg" x="182" y="0" width="24" height="48" rx="4" />
    <rect class="seg" x="208" y="0" width="24" height="48" rx="4" />
    <rect class="seg" x="234" y="0" width="24" height="48" rx="4" />
    <rect class="seg" x="260" y="0" width="24" height="48" rx="4" />
    <rect class="seg" x="286" y="0" width="24" height="48" rx="4" />
    <rect class="seg" x="312" y="0" width="24" height="48" rx="4" />
    <rect class="seg" x="338" y="0" width="24" height="48" rx="4" />
    <rect class="seg" x="364" y="0" width="24" height="48" rx="4" />
    <rect class="seg" x="390" y="0" width="24" height="48" rx="4" />
    <rect class="seg" x="416" y="0" width="24" height="48" rx="4" />
    <text class="small" x="0" y="76">17 physical pages * 32 tokens = 544 token slots</text>
  </g>

  <rect class="attn" x="646" y="330" width="440" height="48" rx="6" />
  <text class="small" x="666" y="360">Attention logical page: block_size = 544 -> 17X bytes</text>
  <rect class="mamba" x="646" y="410" width="440" height="48" rx="6" />
  <text class="small" x="666" y="440">Mamba state page: still one recurrent state page -> 17X bytes</text>
  <text class="muted" x="646" y="502">Aligned page_size_bytes; token semantics remain different</text>
</svg>
