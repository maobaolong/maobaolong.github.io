<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="700" viewBox="0 0 1160 700" role="img" aria-labelledby="title desc">
  <title id="title">LMCache driven register_kv_cache flow</title>
  <desc id="desc">A sequence diagram from vLLM worker tensors to the LMCache multiprocess server registration path.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .lane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
      .box { fill: #eef6ff; stroke: #2563eb; stroke-width: 1.6; }
      .box2 { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.6; }
      .box3 { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.6; }
      .box4 { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.6; }
      .muted { fill: #64748b; font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .text { fill: #0f172a; font: 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #334155; font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .title { fill: #0f172a; font: 700 22px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 5 5; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#334155" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1160" height="700" rx="18" />
  <text class="title" x="40" y="48">register_kv_caches: from vLLM worker memory to LMCache server metadata</text>
  <text class="muted" x="40" y="76">Only the LMCache driven path is shown. The serving engine exports handles; the LMCache server performs later device-side transfers.</text>

  <rect class="lane" x="40" y="112" width="500" height="470" rx="14" />
  <rect class="lane" x="620" y="112" width="500" height="470" rx="14" />
  <text class="title" x="66" y="150">vLLM worker process</text>
  <text class="title" x="646" y="150">LMCache server process</text>

  <rect class="box" x="74" y="186" width="408" height="66" rx="10" />
  <text class="text" x="96" y="213">vLLM calls connector.register_kv_caches</text>
  <text class="small" x="96" y="237">kv_caches: dict[layer_name, tensor]</text>

  <rect class="box" x="74" y="286" width="408" height="82" rx="10" />
  <text class="text" x="96" y="313">apply_kv_cache_group_edits</text>
  <text class="small" x="96" y="337">zero-copy re-view: Mamba / sub-paged MLA</text>
  <text class="small" x="96" y="356">layout_hints: NHD, HND, BLNHC, BLHNC</text>

  <rect class="box" x="74" y="404" width="408" height="82" rx="10" />
  <text class="text" x="96" y="431">create_engine_group_infos_from_vllm</text>
  <text class="small" x="96" y="455">vLLM group metadata + real tensor formats</text>
  <text class="small" x="96" y="474">=> list[EngineGroupInfo]</text>

  <rect class="box2" x="74" y="514" width="408" height="46" rx="10" />
  <text class="text" x="96" y="543">wrap_kv_caches and send REGISTER_KV_CACHE</text>

  <rect class="box3" x="652" y="186" width="408" height="66" rx="10" />
  <text class="text" x="674" y="213">message queue handler</text>
  <text class="small" x="674" y="237">LMCacheDrivenTransferModule.register_kv_cache</text>

  <rect class="box3" x="652" y="286" width="408" height="82" rx="10" />
  <text class="text" x="674" y="313">create_cache_context</text>
  <text class="small" x="674" y="337">unwrap IPC handles back to tensors</text>
  <text class="small" x="674" y="356">detect format and build GPUCacheContext</text>

  <rect class="box3" x="652" y="404" width="408" height="82" rx="10" />
  <text class="text" x="674" y="431">KVLayerGroupsManager</text>
  <text class="small" x="674" y="455">kernel groups, shape desc, tokens/slots</text>
  <text class="small" x="674" y="474">object groups and attention windows</text>

  <rect class="box4" x="652" y="514" width="408" height="46" rx="10" />
  <text class="text" x="674" y="543">layout registry + context table updated</text>

  <path class="arrow" d="M278 252 L278 286" />
  <path class="arrow" d="M278 368 L278 404" />
  <path class="arrow" d="M278 486 L278 514" />
  <path class="arrow" d="M482 537 C540 537 568 219 652 219" />
  <path class="arrow" d="M856 252 L856 286" />
  <path class="arrow" d="M856 368 L856 404" />
  <path class="arrow" d="M856 486 L856 514" />

  <line class="dash" x1="580" y1="118" x2="580" y2="582" />
  <text class="muted" x="500" y="112">IPC boundary</text>

  <rect x="398" y="602" width="364" height="66" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" />
  <text class="small" x="418" y="626">payload crossing the IPC boundary</text>
  <text class="small" x="418" y="648">DeviceIPCWrapper[] + model/world</text>
  <text class="small" x="418" y="666">engine_type + layout_hints + group infos</text>
</svg>
